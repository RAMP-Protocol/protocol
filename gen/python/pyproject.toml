# Packaging for the generated RAMP Python SDK (mirrors gen/ts/package.json for TS).
# The code under this directory is generated by `buf generate` from proto/ — do not
# edit it by hand. Only this file and README.md are authored.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-protocol"
version = "0.1.0"
description = "Generated RAMP vocabulary constants for Python. Message/validation types are generated as Pydantic models from JSON Schema (added via scripts/gen-sdk-types.sh)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Vocabulary constants are pure string literals — no runtime dependency. The
# generated Pydantic models add `pydantic` here when the types export lands.
dependencies = []

[project.urls]
Homepage = "https://ramp-protocol.org"
Source = "https://github.com/RAMP-Protocol/protocol"

[tool.setuptools.packages.find]
where = ["."]
# PEP 420 namespace packages. Currently the vocabulary constants (vocab.pricingunits
# etc.); the Pydantic message models (ramp.v1.*) are added by the types-export step.
namespaces = true
include = ["ramp*", "vocab*"]
