# Packaging for the generated RAMP Python SDK (mirrors gen/ts/package.json for TS).
# The code under this directory is generated by `buf generate` from proto/ — do not
# edit it by hand. Only this file and README.md are authored.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-protocol"
version = "0.1.0"
description = "Generated Python SDK for the RAMP protocol: protobuf messages, Connect service stubs, and registered vocabulary constants."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Messages/enums are the only hard dependency — they import just google.protobuf.
dependencies = [
  "protobuf>=5.27",
]

[project.optional-dependencies]
# Service client/handler stubs (ramp/v1/ramp_connect.py) import the `connectrpc`
# runtime, published as connect-python. Optional so `pip install ramp-protocol`
# works for message-only use. (Confirm the exact PyPI version when publishing.)
connect = ["connect-python>=0.4"]
# Runtime evaluation of the embedded protovalidate CEL rules — optional; consumers
# that only construct/parse messages do not need it.
validation = ["protovalidate>=0.7"]

[project.urls]
Homepage = "https://ramp-protocol.org"
Source = "https://github.com/RAMP-Protocol/protocol"

[tool.setuptools.packages.find]
where = ["."]
# PEP 420 namespace packages — the protobuf/connect plugins emit no __init__.py.
# Imports mirror the proto package: `ramp.v1.ramp_pb2`, `comp.v1.comp_pb2`, and
# the vocabulary constants at `vocab.pricingunits` (etc.).
namespaces = true
include = ["ramp*", "comp*", "vocab*"]
