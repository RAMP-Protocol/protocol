# Packaging for the generated RAMP Python SDK (mirrors gen/ts/package.json for TS).
# The code under this directory is generated by `buf generate` from proto/ — do not
# edit it by hand. Only this file and README.md are authored.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-protocol"
version = "0.1.0"
description = "Generated RAMP types export for Python: Pydantic v2 models (ramp.models) + registered vocabulary constants (vocab.*), generated from the proto via JSON Schema."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Pydantic for the message models; vocabulary constants are pure string literals.
dependencies = [
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://ramp-protocol.org"
Source = "https://github.com/RAMP-Protocol/protocol"

[tool.setuptools.packages.find]
where = ["."]
# PEP 420 namespace packages. Currently the vocabulary constants (vocab.pricingunits
# etc.); the Pydantic message models (ramp.v1.*) are added by the types-export step.
namespaces = true
# Pydantic models at ramp.models; vocabulary constants at vocab.pricingunits (etc.).
include = ["ramp*", "vocab*"]
