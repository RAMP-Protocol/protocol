name: sdk-types-ci

# Drift gate for the generated TYPES EXPORT (Pydantic + Zod). Regenerates from the
# proto via scripts/gen-sdk-types.sh and fails if the committed output differs — the
# same regenerate-and-diff contract as the gen/ drift gate, for the SDK types. Runs
# only when the proto, the descriptor, the generators, or the committed output change.
on:
  push:
    branches: [main]
    paths: &paths
      - 'proto/**'
      - 'gen/descriptor.binpb'
      - 'scripts/gen-sdk-types.sh'
      - 'scripts/check-canonical.sh'
      - 'scripts/sdk-types/**'
      - 'conformance/**'
      - 'gen/python/**'
      - 'gen/ts/**'
      - 'sdk/ts/**'
      - 'sdk/python/**'
      - 'sdk/go/helpers/**'
      - '.github/workflows/sdk-types-ci.yml'
  pull_request:
    paths: *paths

jobs:
  sdk-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.66.1
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: regenerate types export
        run: ./scripts/gen-sdk-types.sh

      # The whole generated wire/ directories, so a NEW generated file (e.g. wire/unique.py)
      # is gated the day it is emitted. The untracked sweep is load-bearing: `git diff` cannot
      # see a file that was generated but never committed, so a file list alone passes green.
      # wire/base.py and wire/base.ts are hand-written seams (never regenerated, so they cannot
      # drift); the vocab constants are generated by buf and gated separately.
      - name: assert no drift
        run: |
          if ! git diff --exit-code -- gen/python/wire gen/ts/wire \
             || [ -n "$(git ls-files --others --exclude-standard -- gen/python/wire gen/ts/wire)" ]; then
            echo "::error::Generated types export is out of sync with the proto. Run scripts/gen-sdk-types.sh and commit gen/python/wire/ + gen/ts/wire/."
            git status --short -- gen/python/wire gen/ts/wire
            exit 1
          fi

      # Cross-language validation parity: the generated Pydantic models and Zod schemas
      # must reach the SAME verdict as Go protovalidate on every case in the generated
      # corpus (conformance/corpus/cases.json) — proving the proto -> JSON Schema ->
      # client pipeline carries every field-level rule. The corpus is pinned to
      # protovalidate by the Go conformance suite (proto-ci) and gated for drift there.
      - name: Python (Pydantic) parity
        run: |
          python -m pip install -q "pydantic>=2.0" pytest
          PYTHONPATH=gen/python pytest gen/python/tests -q

      - name: TypeScript (Zod) parity
        working-directory: gen/ts
        run: |
          npm install
          npm test

      # Canonical proto-JSON interop: each client re-serializes every valid corpus
      # instance and the emission, read back through Go protojson, must decode to the
      # same proto message as the original (incl. Timestamp/Duration). Reuses the
      # .sdk-types-work venv + zod provisioned by gen-sdk-types.sh above.
      - name: Canonical proto-JSON round-trip
        run: ./scripts/check-canonical.sh

  # sdk/ts L1 helpers (thumbprint, signed-URL/PoP verify, cross-field Zod) byte-parity
  # against the sdk/go oracle. The signed-URL + PoP vectors are emitted by the Go golden
  # emitter (sdk/go/helpers TestGenerateVectors); this job first asserts the committed
  # vectors are not stale (default emitter run is a check), then runs the TS suites that
  # assert TS verdicts match those Go-signed vectors + the shared thumbprint/crossfield
  # corpora.
  sdk-l1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Drift gate: the emitter re-derives the vectors from FIXED seeds/timestamps and
      # fails if the committed testdata differs (deterministic, no time.Now()/random).
      # It also guards the sign-request + acceptance vectors the Python parity suite reads.
      - name: assert Go golden vectors are current
        run: go test ./sdk/go/helpers/ -run TestGenerateVectors

      # sdk/ts L1 helpers PLUS the L2 core + Hono server-verify binding (ixs7u.10:
      # offer-verify over JCS, the branded VerifiedOffer guard, the server-verify
      # seam). `npm install` pulls the `canonicalize` JCS dep declared in
      # sdk/ts/package.json; the new core/hono suites run under the same `npm test`.
      - name: TypeScript L1 + L2 core parity
        working-directory: sdk/ts
        run: |
          npm install
          npm test

      # sdk/python L1 helpers (thumbprint, signed-URL verify, RFC 9421 sign/verify +
      # PoP, offer-acceptance, cross-field Pydantic) byte-parity against the same
      # Go-signed vectors + shared crossfield corpus, PLUS the L2 core + the outbound
      # sign face (offer-verify over JCS, VerifiedOffer guard, acceptance JCS
      # re-pin, SigningTransport). Consumes the generated Pydantic types from
      # gen/python (PYTHONPATH) + sdk/python on the path so ramp_sdk.core /
      # ramp_sdk.signing_transport resolve. rfc8785 = the vetted JCS lib the core composes.
      - name: Python L1 + L2 core parity
        run: |
          python -m pip install -q "cryptography>=44" "pydantic>=2.9" "rfc8785>=0.1.2" pytest
          PYTHONPATH=gen/python:sdk/python python -m pytest sdk/python/tests -q
