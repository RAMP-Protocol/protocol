// RAMP v1.0 — Resource Access Metering Protocol.
//
// An open transaction protocol for licensed AI resource access. Extends
// IAB Tech Lab CoMP v1.0 and RSL 1.0 with pricing, exchange orchestration,
// resource identity, transactions, and post-usage reporting.
//
// The ExchangeService is the core protocol. Both AI agents and
// Brokers are valid clients — the Exchange doesn't distinguish.
//
// Wire format: the canonical wire is snake_case proto-JSON — the field names as
// declared here (idempotency_key, unit_cost), used by the generated Pydantic/Zod
// clients and the conformance corpus. The camelCase json_name alias is out of
// contract for those clients. This is load-bearing for signatures: signed messages
// are Ed25519 over JCS-canonicalized (RFC 8785) proto-JSON, and JCS sorts keys, so
// field-name casing determines the signed bytes.

syntax = "proto3";

package ramp.v1;

option go_package = "github.com/RAMP-Protocol/protocol/gen/go/ramp/v1;rampv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "buf/validate/validate.proto";
import "ramp/v1/vocab.proto";

// ============================================================================
// RAMP Authentication Architecture
//
// Auth-agnostic protocol. RAMP defines WHAT must be verified (scopes,
// spend caps, expiry, delegation chain). The HOW (authorization flow,
// token format, signature envelope) is pluggable.
//
// Signatures: JWS (RFC 7515) with alg=EdDSA for content signatures
// (offers, attestations). RFC 9421 HTTP Message Signatures for request
// authentication. Same Ed25519 crypto, standard tooling everywhere.
//
// Authorization flows: GNAP (RFC 9635) recommended, OAuth 2.0 + DPoP
// as enterprise adoption path. Exchange advertises supported methods.
//
// Token format: JWT. The Delegation message is format-agnostic.
//
// Key announcement endpoint (RFC 7517 JWKs, inline) — unified across roles:
//   Commercial overlay (all roles): {domain}/.well-known/ramp.json
//   Identity (WBA directory, all):  {domain}/.well-known/http-message-signatures-directory
//
// Identity keys appear as JsonWebKey objects (with not_before/not_after time
// bounds) in the WBA directory (WBAFile.keys), NOT in ramp.json. Each key is
// identified by its RFC 7638 thumbprint (the RFC 9421 keyid); there is no kid.
// Optional WBAFile.revocation_url publishes a thumbprint-list of
// emergency-revoked keys; consumers poll on a 300s cadence (±10% jitter)
// and sync-fetch on an unknown thumbprint.
//
// Request authentication via RFC 9421 HTTP Message Signatures:
//   Agent → Exchange:  Signature header (alg=ed25519)
//   Agent → Broker → Exchange:  multiple Signature headers (one per hop)
//   Exchange → Agent:  JWS Compact Serialization on Offer (alg=EdDSA)
//
// Signed URLs use HMAC-SHA256 (Exchange↔CDN shared secret, separate concern).
//
// Retrieval-URL identity binding (OPTIONAL, DPoP-style — RFC 9449):
//   The Exchange MAY bind a signed retrieval_endpoint to the requesting agent
//   by embedding agent_identity_hash — the RFC 7638 JWK Thumbprint (SHA-256)
//   of the agent's Ed25519 request-signing key — inside the HMAC-signed URL,
//   and echoing it in the response. A capable delivery endpoint (edge function)
//   verifies the binding fully offline: confirm the URL HMAC (proves the hash
//   is Exchange-issued and untampered), then require the fetcher to present its
//   public key and an RFC 9421 signature over the retrieval request, and check
//   thumbprint(presented key) == agent_identity_hash. No JWKS fetch required.
//   Enforcement is NOT mandatory: a bearer-only signed-URL CDN that cannot run
//   code falls back to HMAC + short TTL + TLS. RAMP reference implementations
//   run on edge functions and DO enforce it.
// ============================================================================

// ============================================================================
// ExchangeService — THE core protocol.
//
// This is what SSPs, providers, or third parties deploy.
// Agents and Brokers are both valid clients.
// ============================================================================

service ExchangeService {
  // Discover available resource offers matching the query.
  // Steps 2-3 in the RAMP flow.
  rpc DiscoverResources(ResourceQuery) returns (ResourceResponse);

  // Commit to an offer and receive delivery information.
  // Steps 4-5 in the RAMP flow.
  rpc ExecuteTransaction(TransactionRequest) returns (TransactionResponse);

  // Submit a post-usage report for a completed transaction.
  // Step 7 in the RAMP flow.
  rpc ReportUsage(UsageReport) returns (UsageReportResponse);

  // Signal a resource dispute for a completed transaction.
  // Filed by the agent when delivered resource does not match what was
  // promised (hash mismatch, resource unavailable, wrong resource).
  // The Exchange records the dispute and initiates resolution.
  // Resolution mechanics (refund, credit, re-delivery) are implementation-
  // specific — this RPC standardizes the dispute signal, not the outcome.
  rpc DisputeTransaction(DisputeRequest) returns (DisputeResponse);

  // Request a domain verification challenge for provider onboarding.
  // Used by ramp-cli to prove domain control before pushing signing keys.
  // Follows the ACME HTTP-01 pattern (Let's Encrypt).
  rpc RequestDomainVerification(DomainVerificationRequest) returns (DomainVerificationChallenge);

  // Confirm domain verification and register a signing key.
  // Called after the challenge token is placed at the provider's domain.
  rpc ConfirmDomainVerification(DomainVerificationConfirmation) returns (DomainVerificationResult);

  // Create the calling agent's account with the Exchange.
  // The caller's identity is proven by the request signature — the Exchange
  // derives who is registering from the verified signature, never from the
  // request body. Registering again for the same agent returns the same
  // billing_ref (idempotent by design), which is why this RPC carries no
  // idempotency_key. A refused registration travels as a non-OK transport
  // error carrying ErrorDetail.registration_failure.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Read-only check of whether the calling agent's account is active.
  // Identity comes from the request signature, so the request carries no
  // identifying field.
  rpc GetAccountStatus(GetAccountStatusRequest) returns (GetAccountStatusResponse);
}

// ============================================================================
// Resource Discovery (Steps 2-3)
// ============================================================================

// AcceptableRestriction — the limits a query operates within on one restriction
// axis, expressed in the same RestrictionKind vocabulary that terms use. The
// Exchange/Broker MAY pre-select offers whose term restrictions fall within
// these as a convenience (see Restriction); it is NOT enforcement — the agent
// self-selects and bears compliance.
message AcceptableRestriction {
  // Which axis (same enum as Restriction.kind): FUNCTION / GEOGRAPHY /
  // USER_TYPE / OTHER.
  RestrictionKind axis = 1;

  // The values the query operates within on this axis — same token vocabulary
  // as the terms (e.g. FUNCTION ["ai-train"], GEOGRAPHY ["US", "EU"]).
  repeated string values = 2 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9._:*-]+$"
  ];
}

// ResourceQuery — Query an Exchange for available resource offers.
//
// Sent by a Broker or directly by an AI agent.
// The Exchange evaluates its access policies, available inventory,
// and reporting requirements before responding.
message ResourceQuery {
  // RAMP protocol version.
  string ver = 1;

  // Requester identity — who is making this request, what scopes they have,
  // and optional delegation chain.
  Requester requester = 3;

  // Resource URIs being queried.
  repeated string uris = 8 [(buf.validate.field).repeated.max_items = 256];

  // The limits this query operates within, per restriction axis (function,
  // geography, user-type, …) — see AcceptableRestriction. Advisory selection
  // inputs the Exchange/Broker MAY pre-select offers against (convenience, not
  // enforcement); the agent self-selects and bears compliance.
  repeated AcceptableRestriction acceptable_restrictions = 9;

  // Multi-hop forwarding (Agent → Broker → … → Exchange) is carried in the HTTP
  // layer, not in this message: each forwarding party adds its own labeled
  // RFC 9421 HTTP Message Signature (Signature / Signature-Input), and each
  // signature covers the request plus the prior hop's signature — so the ordered
  // set of signatures IS the forwarding chain, tamper-evident and order-bound.
  // The Exchange resolves each hop's key (keyid → domain → /.well-known/ramp.json),
  // verifies every signature, and enforces RequestConstraints.max_hops /
  // WellKnownManifest.max_intermediary_hops by counting them. (Field 5 unused.)

  // Maximum time the caller will wait for a response.
  // Exchange SHOULD prioritize speed over completeness when tight.
  // Absent = "0.5s" default (proto-JSON encodes Duration as seconds).
  optional google.protobuf.Duration deadline = 6;

  // Domain extension profiles the caller understands.
  //
  // Declares which ext field vocabularies the caller can parse and act on.
  // The Exchange SHOULD include profile-specific ext fields in Offers
  // when the caller declares support. The Exchange MAY skip expensive
  // metadata computation (e.g., retraction checking, consolidation
  // verification) when the caller does not declare the relevant profile.
  //
  // Absence means "send all available metadata" — Exchange MUST NOT
  // withhold ext fields solely because the caller omitted this field.
  //
  // Values match the Exchange's WellKnownManifest.supported_profiles entries.
  // Examples: ["ramp-news-v1", "ramp-academic-v1", "ramp-legal-v1"]
  repeated string supported_profiles = 7;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ResourceResponse — Exchange returns candidate resource offers.
//
// When the ResourceQuery contains multiple URIs, offers are grouped by URI
// via OfferGroup. When a single URI is queried, the Exchange MAY use
// either the flat `offers` field or a single OfferGroup.
message ResourceResponse {
  // Protocol version
  string ver = 1;

  // Canonical domain of the responding Exchange.
  string exchange = 3;

  // Flat list of offers (for single-URI queries).
  repeated Offer offers = 4;

  // Offers grouped by requested URI (for multi-URI batch queries).
  // When populated, `offers` SHOULD be empty to avoid ambiguity.
  repeated OfferGroup offer_groups = 5;

  // Rate limit status for this caller.
  // Present when the Exchange enforces per-caller rate limits on discovery.
  // Enables agents/Brokers to throttle proactively rather than hitting
  // hard limits. Particularly important when a Broker fans out the
  // same batch query to multiple Exchanges — mid-batch rate limiting
  // can cause partial results if not signaled early.
  optional RateLimitInfo rate_limit = 6;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// OfferGroup — Offers for a single requested URI.
// Enables multi-URI batch queries where the caller needs to know
// which offers correspond to which requested resource.
message OfferGroup {
  // The URI this group of offers is for (echoed from ResourceQuery.uris).
  string uri = 1;

  // Zero or more offers for this URI. Empty = resource not available.
  repeated Offer offers = 2;

  // How this URI was discovered by the Broker (v2 extension point).
  // v1: always DISCOVERY_METHOD_EXCHANGE (Broker queried an Exchange).
  // v2: may include DISCOVERY_METHOD_SEARCH (URI found via search engine like Exa),
  //     DISCOVERY_METHOD_RECOMMENDATION, etc. The Broker discovers URIs
  //     through any source, then routes through Exchange for pricing/transaction.
  //     The discovery method does not affect the transaction flow — it's metadata
  //     for the agent to understand how the resource was found.
  optional DiscoveryMethod discovery_method = 3;

  // Why no offers are available for this URI.
  // Present when `offers` is empty. Enables agents/Brokers to distinguish
  // "resource not in catalog" from "resource blocked for your use case" without
  // trial-and-error transactions. Analogous to OpenRTB nbr codes and
  // Shutterstock per-item error metadata in batch responses.
  optional OfferAbsenceReason absence_reason = 4;

  // When absence_reason = RESTRICTION_FILTERED, the restriction axes that drove
  // the convenience pre-filter, in the same RestrictionKind vocabulary the terms
  // use (e.g. [GEOGRAPHY] when the requester's stated geography matched no term).
  // Advisory diagnostics, not an enforcement verdict.
  repeated RestrictionKind restriction_filters = 5;
}

// DiscoveryMethod — How the Broker discovered this resource URI.
// Metadata for the agent; does not affect transaction flow.
enum DiscoveryMethod {
  DISCOVERY_METHOD_UNSPECIFIED = 0;  // unset — output/optional; zero is a valid not-applicable/unset state
  // URI was requested by the agent directly or found via Exchange query.
  DISCOVERY_METHOD_EXCHANGE = 1;
  // URI was discovered via a search engine (e.g., Exa, Tavily, Brave Search).
  // The Broker searched on the agent's behalf, then routed through Exchange.
  DISCOVERY_METHOD_SEARCH = 2;
  // URI was recommended by a resource recommendation service.
  DISCOVERY_METHOD_RECOMMENDATION = 3;
  // URI was found via resource syndication tracking (e.g., same article on another domain).
  DISCOVERY_METHOD_SYNDICATION = 4;
}

// OfferAbsenceReason — Why no offers are available for a requested URI.
// Used in OfferGroup.absence_reason when offers is empty.
// Enables diagnostic feedback without requiring a transaction attempt.
enum OfferAbsenceReason {
  OFFER_ABSENCE_REASON_UNSPECIFIED = 0;  // unset — output/optional; zero is a valid not-applicable/unset state
  // Resource URI is not in this Exchange's catalog.
  OFFER_ABSENCE_REASON_NOT_IN_CATALOG = 1;
  // Resource exists but the provider has opted out of AI access for it (the
  // provider's consent/opt-out signal blocks licensing).
  OFFER_ABSENCE_REASON_CONTENT_BLOCKED = 2;
  // Resource exists but its offers were pre-filtered out for one or more
  // restriction axes the requester stated (a convenience filter matched to the
  // query, not an enforcement verdict — see Restriction). The filtered axes are
  // listed in OfferGroup.restriction_filters, in the same RestrictionKind
  // vocabulary the terms use. The agent MAY still be eligible.
  OFFER_ABSENCE_REASON_RESTRICTION_FILTERED = 3;
  // Resource is temporarily unavailable (e.g., provider feed refresh in progress).
  OFFER_ABSENCE_REASON_TEMPORARILY_UNAVAILABLE = 4;
  // Exchange is not authorized by the provider to sell this resource.
  OFFER_ABSENCE_REASON_NOT_AUTHORIZED = 5;
  // Requester's scopes/subscription do not cover this resource. Applies wherever
  // access is gated by subscription or scope entitlements (not only enterprise
  // deployments): the resource exists but the requester's delegation token or
  // subscription does not grant it. The Exchange returns this so the requester
  // learns the resource is reachable under the right subscription/scope. (Where
  // existence itself must stay hidden, the Exchange MAY omit it silently instead.)
  OFFER_ABSENCE_REASON_SCOPE_INSUFFICIENT = 6;

  // Consumer encountered ext_critical keys it does not recognize.
  // The unrecognized keys SHOULD be listed in the OfferGroup's ext field
  // under "unrecognized_critical_extensions" for diagnostic purposes.
  OFFER_ABSENCE_REASON_UNKNOWN_CRITICAL_EXTENSION = 7;

  // Offers exist, but none fit within the requester's budget (e.g. every offer's
  // price exceeds RequestConstraints.period_budget). Returned by Resolve as a
  // successful "no result" answer when a budget/price ceiling filtered out every
  // otherwise-licensable offer.
  OFFER_ABSENCE_REASON_BUDGET_EXCEEDED = 8;
}

// RateLimitInfo — Caller's rate limit status on this Exchange.
// Modeled after IETF RateLimit header fields (RFC 9110 §15.5.30)
// and Shutterstock's rate limit response pattern.
message RateLimitInfo {
  // Maximum requests allowed in the current window.
  int32 limit = 1;

  // Requests remaining in the current window.
  int32 remaining = 2;

  // When the current window resets (UTC). After this time, `remaining` resets to `limit`.
  google.protobuf.Timestamp reset_at = 3;

  // Duration of the rate limit window (e.g. 60s = per-minute limit).
  optional google.protobuf.Duration window = 4;
}

// SubscriptionQuotaInfo — Proactive quota signaling for subscription access.
//
// Analogous to RateLimitInfo (which signals API request rate limits), this
// signals subscription consumption quotas. Enables agents to throttle
// proactively instead of discovering exhaustion via denial.
//
// Returned on Offer (per-offer quota visibility) and TransactionResponse
// (post-transaction remaining quota). A subscription may have multiple
// independent quotas (access count + spend cap + burst limit), so this
// message is used as a repeated field.
//
// Quota decrement timing: the counter increments at ExecuteTransaction
// (optimistic decrement, before delivery). If delivery fails, the agent
// files a DisputeTransaction which may reverse the decrement. This is
// consistent with the billing model (billing_id created at transaction time).
message SubscriptionQuotaInfo {
  // Subscription this quota applies to.
  string subscription_id = 1;

  // Total allowed in the current period.
  int32 quota_limit = 2;

  // Used so far in the current period.
  int32 quota_used = 3;

  // Remaining in the current period.
  int32 quota_remaining = 4;

  // When the quota counter resets (UTC).
  optional google.protobuf.Timestamp resets_at = 5;

  // What is being metered. Distinguishes access count quotas from
  // spend quotas from burst limits.
  // Standard values: "accesses", "tokens", "spend_cents", "burst"
  optional string unit = 6;
}

// ============================================================================
// Offers and Pricing
// ============================================================================

// Offer — A single resource offer from an Exchange.
//
// Combines pricing, delivery method, resource identity, and reporting terms.
// CoMP-specific metadata (Package, Function) available via ramp-comp-v1 extension profile.
message Offer {
  // Unique identifier for this offer, assigned by the Exchange.
  string offer_id = 1;

  // Resource title (human-readable, for display/logging).
  optional string title = 2;

  // Pricing for this offer. An offer represents a single licensing
  // arrangement: each projected LicenseTerm yields its own offer, so this is
  // that term's pricing (the authoritative copy lives in `terms[].pricing`).
  // Used for cross-exchange comparison and Broker ranking. A resource with
  // multiple alternative terms (e.g. dual-licensed) produces multiple separate
  // offers, one per term — never one offer with a "headline" picked among them.
  Pricing pricing = 3;

  // How resource will be delivered.
  DeliveryMethod delivery_method = 4;

  // Post-usage reporting requirements for this offer.
  optional ReportingObligation reporting = 5;

  // When this offer expires (ISO 8601).
  optional google.protobuf.Timestamp expires_at = 6;

  // Resource identity for cross-exchange deduplication.
  // Enables Brokers to recognize the same resource offered by
  // different Exchanges and compare pricing.
  optional ResourceIdentity identity = 7;

  // Canonical domain of the Exchange that issued this offer (e.g.
  // "exchange.example.com"). This is the execute-routing target: the agent (or
  // a relaying Broker) sends the ExecuteTransaction call for this offer to this
  // Exchange. Because it is an ordinary Offer field it falls inside the signed
  // bytes (see `signature` below — the signature covers every field except
  // `signature` / `signature_algorithm`), so an intermediary cannot redirect
  // the execute call to a different Exchange without invalidating the offer.
  // This enables multi-Exchange fan-out routing from the offer itself,
  // retiring the X-RAMP-Exchange-Endpoint transport header.
  string exchange = 8;

  // REQUIRED. JWS (alg=EdDSA) over the canonical serialization of the ENTIRE
  // Offer — every field, including `pricing`, `terms` (the full licensing
  // payload), `expires_at`, and `exchange`. Only `signature` and
  // `signature_algorithm` are excluded from the signed bytes. `expires_at` is
  // signed so the offer's validity window is integrity-protected: a relaying
  // Broker cannot extend (or shorten) the TTL of a signed offer to replay it
  // outside the window the Exchange intended.
  //
  // CANONICAL SIGNING (RFC 8785 JCS over canonical proto-JSON). The signed bytes
  // are:
  //
  //     signed_payload = JCS( protojson(msg with signature +
  //                                      signature_algorithm cleared) )
  //
  // i.e. render the message to canonical proto-JSON with the PINNED option set
  // below, then apply RFC 8785 (JSON Canonicalization Scheme). Deterministic
  // protobuf BINARY marshaling is explicitly NOT canonical across languages and
  // versions (protobuf's own caveat), so it cannot be a cross-language signing
  // primitive; JCS over proto-JSON can be reproduced by ANY language (Go, TS,
  // Python) without a protobuf binary codec, so a broker/exchange/client in any
  // language signs and verifies byte-identically. This same definition applies to
  // the agent offer-acceptance signature (AgentAcceptance.signature).
  //
  // PINNED proto-JSON option set (the arbiter is the Go-emitted golden vector —
  // whatever these options render MUST be byte-identical across all languages):
  //   - enum values as NAME strings (not numbers);
  //   - int64 / uint64 / fixed64 as decimal STRINGS;
  //   - bytes as standard (padded) base64;
  //   - google.protobuf.Timestamp / Duration per the proto-JSON WKT rules
  //     (RFC 3339 string for Timestamp);
  //   - unpopulated fields are OMITTED (never emitted as defaults);
  //   - field naming is snake_case (the proto field name, UseProtoNames=true),
  //     the naming every SDK target shares — wire, corpus, and signed form are all
  //     snake_case;
  //   - google.protobuf.Struct (`ext`) → a plain JSON object; JCS then sorts its
  //     keys recursively, so the Struct case needs no special handling.
  //
  // Because the signature covers `terms`, `pricing`, `expires_at`, and
  // `exchange`, an intermediary (Broker) cannot tamper with price, restrictions,
  // quotas, obligations, the expiry, the execute-routing target, or any
  // licensing term without invalidating it.
  // Agent SHOULD verify the signature (RFC 2119) against the Exchange's public
  // key, and MUST reject an offer whose `expires_at` is in the past.
  string signature = 9;

  // JWS algorithm. Always 'EdDSA' for Ed25519 via JWS Compact Serialization.
  string signature_algorithm = 10;

  // If set, this offer is available under an existing subscription/deal.
  // No per-request billing — usage tracked against subscription quota.
  // Pricing.rate = "0" for subscription offers (zero marginal cost).
  // The Broker SHOULD prefer subscription offers when available.
  optional string subscription_id = 11;

  // IAB Content Taxonomy category codes.
  // Enables agents to filter offers by topic (e.g., "only finance resources").
  // Uses IAB Content Taxonomy 3.1 codes.
  repeated string iab_categories = 13;

  // Signed attestations about the resource at this URI.
  // Attestations provide cryptographic proof of
  // resource properties from trusted parties (providers or verification vendors).
  //
  // Three verification levels determine what is independently verifiable:
  //   Level 0 (no attestations): Resource may carry identifiers (DOI, IPTC GUID)
  //     for identification, but nothing is cryptographically verifiable.
  //     Only CDN delivery failure is auto-disputable.
  //   Level 1 (self-attested): Provider signs own claims with Ed25519 key.
  //     Agent can independently verify content hash and token count.
  //     CDN delivery failure + content hash mismatch are auto-disputable.
  //   Level 2 (third-party attested): Independent verification vendor crawled
  //     the resource and attested to its properties. Agent trusts the attestation
  //     (does not re-verify hash). Token count discrepancy is auto-disputable
  //     when corroborated by CDN response size.
  //
  // Multiple attestations may be present (e.g., provider self-attestation
  // plus a third-party verification). Agents choose which to trust.
  repeated ResourceAttestation attestations = 14;

  // When the offered data was current. For dynamic resources
  // (resource_mutability = DYNAMIC), this is the snapshot timestamp.
  // Enables the Broker to evaluate freshness: "this credit report
  // reflects data as of March 18" or "this drug database was updated today."
  //
  // Not set for STATIC resources (content doesn't change) or LIVE
  // resources (content doesn't exist yet).
  //
  // The Broker compares this against RequestConstraints.max_data_age
  // to filter stale offers. Example: agent requests max_data_age = 7 days,
  // Broker drops offers where now() - data_as_of > 7 days.
  optional google.protobuf.Timestamp data_as_of = 16;

  // Subscription quota state, when this offer is under a subscription.
  // Enables the agent to see remaining quota before committing.
  // Multiple entries when the subscription has independent quotas
  // (e.g., access count + spend cap).
  repeated SubscriptionQuotaInfo subscription_quota = 17;

  // Lightweight previews for offer evaluation.
  // The Exchange holds URLs (50–200 bytes each); the provider's CDN serves
  // the actual bytes. Agents fetch previews only when evaluating offers —
  // not on every discovery query. Multiple previews at different sizes
  // allow agents to pick the cheapest fetch for their evaluation needs.
  //
  // Per content type:
  //   Image:  watermarked thumbnail (150–450px JPEG)
  //   Video:  short clip (10–30s MP4, watermarked)
  //   Audio:  short clip (15–30s MP3, low-bitrate or watermarked)
  //   Text:   snippet or abstract (first 200 words as text/plain)
  //   Data:   sample records (1–3 rows as application/json)
  //   Stream: optional frame capture or none (streams are priced by time)
  //
  // Modeled after Shutterstock (multi-size thumbnail URLs),
  // Spotify (preview_url to 30s clip), IIIF (parameterized image URLs),
  // and OpenRTB native (img.url + dimensions).
  repeated Preview previews = 18;

  // Licensing terms for this offer, sourced from the publisher's ResourceEntry.
  // Multiple terms when the resource has different arrangements by use case.
  // See: Universal Licensing Core section.
  repeated LicenseTerm terms = 19;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ResourceIdentity — Layered resource identification and verification.
//
// Serves two purposes:
// 1. Cross-exchange deduplication (Broker groups offers for
//    the same underlying resource to compare pricing).
// 2. Resource integrity verification (agent checks that delivered
//    resource matches what was promised).
//
// Providers declare what verification level they support via
// content_hash + hash_method. Higher verification = higher trust =
// resource can command premium pricing.
//
//   Level 0: No hash (canonical_url only). Agent gets what it gets.
//   Level 1: SimHash (fuzzy match). Tolerates minor page changes
//            (ads, nav, timestamps). Catches bait-and-switch.
//   Level 2: SHA-256 (exact match). Provider serves a clean,
//            deterministic payload. Agent verifies exact content.
//
// This is non-blocking on current infrastructure: providers who
// serve dynamic pages use Level 0-1. Providers who invest in
// consistent resource delivery reach Level 2 and earn more.
//
// CoMP's Package.id identifies the *package* (exchange-specific);
// ResourceIdentity identifies the *resource* (cross-exchange).
message ResourceIdentity {
  // --- Identification (who is this resource?) ---

  // Provider's authoritative URL for this resource (rel="canonical").
  // Always available. Different per provider for syndicated content.
  optional string canonical_url = 1;

  // Digital Object Identifier — persistent, never changes.
  optional string doi = 2;

  // IPTC NewsML-G2 globally unique identifier.
  // Present when resource flows through news wire syndication (AP, Reuters).
  optional string iptc_guid = 3;

  // International Standard Name Identifier for the creator.
  optional string isni = 4;

  // --- Verification (is this the right resource?) ---

  // Hash of the content. Interpretation depends on hash_method:
  //   "simhash-v1" → locality-sensitive hash, for fuzzy dedup (Level 1)
  //   "sha256"     → exact-match integrity hash (Level 2)
  //
  // Level 1 (SimHash): computed by Exchange from extracted text.
  //   Agent verifies that fetched content is "substantially similar."
  //   Tolerates dynamic page elements.
  //
  // Level 2 (SHA-256): computed by provider from deterministic payload.
  //   Agent verifies exact match. Requires provider to serve consistent
  //   content (e.g., API endpoint, static HTML, structured JSON).
  //   Mismatch = dispute. Commands premium pricing.
  optional string content_hash = 5;

  // Hash algorithm and verification level.
  // Examples: "simhash-v1", "minhash-v1", "sha256", "sha384"
  optional string hash_method = 6;

  // --- Mutability ---

  // Signals whether this resource's content is stable, changes over time,
  // or does not exist at offer time (live streaming).
  //
  // Drives hash verification behavior:
  //   STATIC:  content_hash is stable. Agent SHOULD verify delivered content matches.
  //   DYNAMIC: content changes between offer and fetch (credit reports, drug databases).
  //            content_hash reflects state at offer generation time. Hash mismatch is
  //            expected and MUST NOT trigger automatic dispute.
  //   LIVE:    content does not exist at offer time (streaming feeds, live broadcasts).
  //            content_hash is not applicable. The "resource" is the stream endpoint.
  //
  // Validated across 18 use cases: static content (articles, patents, legislation),
  // dynamic data (credit reports, drug interactions, stock snapshots), and live
  // streams (MarketData quotes, NPR broadcast, news monitoring feeds).
  ResourceMutability resource_mutability = 8 [(buf.validate.field).enum = {not_in: [0]}];


  // --- Provenance (C2PA Content Credentials) ---

  // C2PA content credentials manifest URI.
  // Points to a sidecar or embedded C2PA manifest for this resource.
  // C2PA-aware agents MAY follow this URI to validate the full provenance
  // chain (creator identity, transformation history, ingredient composition)
  // using C2PA libraries (JUMBF/COSE Sign1). C2PA-unaware agents can rely
  // on c2pa_status and c2pa-bridged attestation claims instead.
  //
  // Formats:
  //   Sidecar: HTTPS URI to a .c2pa manifest file
  //   Embedded: same URI as canonical_url (manifest is inside the asset)
  //   Content Credentials Cloud: https://contentcredentials.org/verify?uri=...
  optional string c2pa_manifest = 7;

  // Summary validation status of the C2PA manifest.
  // Populated by the Exchange or a verification vendor after validating
  // the C2PA manifest. Enables agents to filter for provenance-verified
  // content without parsing JUMBF/COSE themselves.
  //
  // The full C2PA validation details (signer identity, trust list,
  // action history, training/mining status) are carried in a
  // ResourceAttestation with c2pa.* claims — see ramp-c2pa-v1 profile.
  optional C2PAStatus c2pa_status = 9;

  // Soft binding hash — content-derived identifier that survives format
  // transcoding (resolution changes, compression, PDF-to-text extraction).
  // Extracted from C2PA soft binding assertion when present.
  // Enables post-delivery verification when the hard binding hash breaks
  // due to legitimate format conversion.
  //
  // Algorithm specified in soft_binding_method. Values are algorithm-specific
  // (e.g., perceptual hash hex string, watermark identifier).
  optional string soft_binding = 10;

  // Algorithm used for soft_binding.
  // Examples: "phash-v1" (perceptual hash), "c2pa-watermark" (C2PA invisible
  // watermark), "chromaprint" (audio fingerprint).
  optional string soft_binding_method = 11;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ResourceAttestation — Signed envelope of claims from a trusted party.
//
// A provider or third-party verification vendor (GumGum, DoubleVerify, IAS)
// attests to properties of the resource at a specific URI at a specific time.
// The signature covers all fields, proving origin and integrity of the claims.
//
// Verification levels (determined by who the verifier is):
//   Level 0: No attestation present. Resource may carry identifiers
//     (DOI, IPTC GUID via ResourceIdentity) but nothing is cryptographically
//     verifiable. Only CDN delivery failure is auto-disputable.
//   Level 1 (self-attested): verifier == provider domain. Provider signs
//     own claims with their Ed25519 key. Agent can independently verify
//     content_hash by re-computing it from delivered bytes. Requires the
//     provider to serve deterministic content at the delivery endpoint.
//   Level 2 (third-party attested): verifier == verification vendor domain.
//     Vendor independently crawled the resource and attested to its properties.
//     Agent trusts the attestation — does NOT re-verify the content hash
//     (agent lacks the vendor's extraction algorithm). The Ed25519 signature
//     proves the vendor made the attestation; trust is binary ("do I trust
//     this vendor?").
//
// Claims are limited to 4KB. Attestations are carried in-memory in the
// Exchange catalog and in Offer responses — strict size limits protect
// against payload poisoning and ensure catalog performance at scale.
//
// Verifiers MUST publish their attestation-signing keys in their WBA directory
// (WBAFile.keys) at:
//   https://{verifier-domain}/.well-known/http-message-signatures-directory
// identified by RFC 7638 thumbprint. Verifiers publish the claims-schema
// structure at WellKnownManifest.ext["ramp.attestation.claims_schema"].
message ResourceAttestation {
  // Canonical domain of the attesting party (e.g., "nytimes.com" for
  // self-attestation, "doubleverify.com" for third-party attestation).
  // Used to look up the verifier's attestation-signing keys in its WBA
  // directory (WBAFile.keys) at
  //   https://{verifier}/.well-known/http-message-signatures-directory
  string verifier = 1;

  // RFC 7638 JWK Thumbprint (the RFC 9421 keyid) of the verifier's
  // attestation-signing key, resolved against the verifier's WBA directory
  // (WBAFile.keys). Identifies which Ed25519 key signed this attestation.
  // Enables key rotation: new keys are published with overlapping validity,
  // new attestations use the new key's thumbprint, old attestations remain
  // verifiable while the old key is still published.
  string keyid = 2;

  // When this attestation was created. Agents use this to assess freshness
  // (e.g., "I accept attestations up to N hours old for breaking news").
  google.protobuf.Timestamp attested_at = 3;

  // The resource URI this attestation covers. Must match the URI in the
  // Offer or ResourceEntry this attestation is attached to.
  string uri = 4;

  // Signed claims about the resource (max 4KB). A JSON object containing
  // whatever properties the attesting party can determine about the resource.
  // Recommended claim names for interoperability:
  //   estimated_quantity (integer): estimated consumption quantity (e.g., token count for text)
  //   word_count (integer): word count (estimated_quantity ~ word_count * 1.32 for text)
  //   language (string): ISO 639-1 language code
  //   iab_categories (string[]): IAB Content Taxonomy 3.1 codes
  //   content_hash (string): hash of content in "method:hexdigest" format
  //   hash_method (string): algorithm used for content_hash
  // Vendors MAY add vendor-specific claims (e.g., brand_safety, sentiment).
  // The protocol does NOT define "quality score" — it is inherently subjective.
  // If a vendor provides a proprietary score, the vendor defines what it means
  // via their WellKnownManifest ext["ramp.attestation.claims_schema"].
  google.protobuf.Struct claims = 5;

  // Ed25519 signature over JCS-canonicalized (RFC 8785) representation of
  // {verifier, keyid, attested_at, uri, claims}. JCS (JSON Canonicalization
  // Scheme) produces deterministic UTF-8 bytes: lexicographic key sorting,
  // ECMAScript number serialization, strict string escaping, no whitespace.
  // Each attestation is self-contained — new claim fields do not invalidate
  // old attestations because the signature covers the specific claims instance.
  string signature = 6;
}

// ============================================================================
// Universal Licensing Core
//
// A resource carries zero or more LicenseTerm entries. Each term describes one
// distinct commercial or access arrangement for that resource. Having multiple
// terms is the normal case:
//
//   Article with two terms:
//     Term 1 — ENUMERATED, ai-input permitted, academic only, FREE
//     Term 2 — ENUMERATED, ai-input permitted, commercial_entity,
//               PER_UNIT $0.05/access
//
//   Stock photo with one term:
//     Term 1 — ENUMERATED, display permitted, worldwide, PER_UNIT $1.20/access,
//               metering=NONE (perpetual), impressions quota 500k,
//               ATTRIBUTION obligation
//
//   Patent design file:
//     Term 1 — ENUMERATED, manufacture permitted, worldwide,
//               FLAT $200, metering=OFFLINE_SELF_REPORTED,
//               quota metric=units-manufactured limit=1000 window=TOTAL,
//               CONTRIBUTION obligation
//
//   Licensed music track:
//     Term 1 — ENUMERATED, sync permitted, worldwide, FLAT $500,
//               metering=NONE, NOTICE obligation
//     Term 2 — REFERENCE_ONLY — full MCPS/PRS terms at License.uri
//
// Pricing is REQUIRED on every term regardless of semantics — absent Pricing
// is a validation error, and model=FREE must be stated explicitly (absent
// Pricing ≠ free). The rest of the rules depend on semantics:
//   ENUMERATED  — the machine restrictions/quotas/obligations are the COMPLETE,
//                 authoritative expression of the term; they must be internally
//                 consistent (a term may not contradict itself) and are enforced
//                 by the Exchange.
//   REFERENCE_ONLY — the document at License.uri (which MUST be present) is the
//                 authoritative, complete source; the agent MUST read it before
//                 using. The machine restrictions/quotas/obligations are
//                 OPTIONAL here — the publisher MAY send Pricing alone — but any
//                 that ARE sent must be accurate: they MUST NOT contradict the
//                 referenced document, and whatever is expressed IS enforced
//                 just like ENUMERATED. Pricing is stated machine-readably here
//                 either way.
//
// LicenseTerm lives in ResourceEntry (ingestion) and Offer (emission) — the
// same shape at both ends. The Exchange stores terms from PushResources and
// surfaces them on DiscoverResources/ExecuteTransaction.
// ============================================================================

// TermSemantics — How the Exchange interprets a LicenseTerm's machine fields.
enum TermSemantics {
  TERM_SEMANTICS_UNSPECIFIED    = 0;  // unset — rejected at ingest
  TERM_SEMANTICS_ENUMERATED     = 1;  // Machine `restrictions`/`quotas`/`obligations` are the complete, authoritative expression of the term (internally consistent, no self-contradiction) and are enforced. `Pricing` MUST be present.
  TERM_SEMANTICS_REFERENCE_ONLY = 2;  // The document at `License.uri` (MUST be non-empty) is the authoritative, complete source; the agent reads it before using. Machine `restrictions`/`quotas`/`obligations` are optional here (the publisher MAY send `Pricing` alone) but any that are sent must be accurate (MUST NOT contradict the referenced document) and are enforced just like ENUMERATED. `Pricing` is still required.
}

// RestrictionKind — Which dimension a Restriction constrains.
//
// The token vocabulary for each open axis is authored ONLY in the
// (ramp.v1.vocab_enum) entries on the corresponding enum value below; the
// functiontokens / geographytokens / usertypes constants + IsRegistered derive
// from them. GEOGRAPHY lists only the non-ISO specials (*, EU, EEA) — ISO
// 3166-1 alpha-2 codes are validated structurally (two-letter uppercase),
// not enumerated.
enum RestrictionKind {
  RESTRICTION_KIND_UNSPECIFIED = 0;  // unset — zero allowed on AcceptableRestriction.axis / OfferGroup.restriction_filters / *.restriction_mismatches; rejected (not_in:[0]) as the Restriction.kind discriminator

  // What the agent may do with the content. Seeded from RSL 1.0 AI-use
  // vocabulary and extended with established IP/copyright terms.
  RESTRICTION_KIND_FUNCTION = 1 [
    (ramp.v1.vocab_enum_package) = "functiontokens",
    (ramp.v1.vocab_enum) = "all",
    (ramp.v1.vocab_enum) = "ai-all",
    (ramp.v1.vocab_enum) = "ai-train",
    (ramp.v1.vocab_enum) = "ai-input",
    (ramp.v1.vocab_enum) = "ai-index",
    (ramp.v1.vocab_enum) = "search",
    (ramp.v1.vocab_enum) = "crawl",
    (ramp.v1.vocab_enum) = "text-and-data-mining",
    (ramp.v1.vocab_enum) = "tts",
    (ramp.v1.vocab_enum) = "commercial",
    (ramp.v1.vocab_enum) = "advertising",
    (ramp.v1.vocab_enum) = "editorial",
    (ramp.v1.vocab_enum) = "research",
    (ramp.v1.vocab_enum) = "reproduce",
    (ramp.v1.vocab_enum) = "distribute",
    (ramp.v1.vocab_enum) = "modify",
    (ramp.v1.vocab_enum) = "display",
    (ramp.v1.vocab_enum) = "sync",
    (ramp.v1.vocab_enum) = "broadcast",
    (ramp.v1.vocab_enum) = "stream",
    (ramp.v1.vocab_enum) = "print",
    (ramp.v1.vocab_enum) = "manufacture",
    (ramp.v1.vocab_enum) = "sell"
  ];

  // Where the agent may use the content. ISO 3166-1 alpha-2 codes (US, DE, GB)
  // are valid structurally; only the non-ISO specials are registered here.
  RESTRICTION_KIND_GEOGRAPHY = 2 [
    (ramp.v1.vocab_enum_package) = "geographytokens",
    (ramp.v1.vocab_enum) = "*",
    (ramp.v1.vocab_enum) = "EU",
    (ramp.v1.vocab_enum) = "EEA"
  ];

  // Who may access and use the content.
  RESTRICTION_KIND_USER_TYPE = 3 [
    (ramp.v1.vocab_enum_package) = "usertypes",
    (ramp.v1.vocab_enum) = "individual",
    (ramp.v1.vocab_enum) = "academic",
    (ramp.v1.vocab_enum) = "non_profit",
    (ramp.v1.vocab_enum) = "news_publisher",
    (ramp.v1.vocab_enum) = "broadcaster",
    (ramp.v1.vocab_enum) = "commercial_entity"
  ];

  RESTRICTION_KIND_OTHER = 4;  // Custom axis; values carried in permitted/prohibited
}

// QuotaWindow — Time window over which a Quota.limit accumulates.
enum QuotaWindow {
  QUOTA_WINDOW_UNSPECIFIED = 0;  // unset — rejected at ingest
  QUOTA_WINDOW_HOURLY      = 1;  // Resets each hour
  QUOTA_WINDOW_DAILY       = 2;  // Resets each day
  QUOTA_WINDOW_MONTHLY     = 3;  // Resets each month
  QUOTA_WINDOW_TOTAL       = 4;  // Lifetime cap — never resets
}

// ObligationKind — What the agent must do after use.
enum ObligationKind {
  OBLIGATION_KIND_UNSPECIFIED      = 0;  // unset — rejected at ingest
  OBLIGATION_KIND_ATTRIBUTION      = 1;  // Credit the author or publisher whenever the resource is used
  OBLIGATION_KIND_CONTRIBUTION     = 2;  // Good-faith payment — amount suggested, not contractually fixed
  OBLIGATION_KIND_SHARE_ALIKE      = 3;  // Derivatives must be released under the same / compatible license (CC-BY-SA / GPL style); scope_license required
  OBLIGATION_KIND_NETWORK_COPYLEFT = 4;  // Network service triggers copyleft (AGPL style)
  OBLIGATION_KIND_NOTICE           = 5;  // Include the specified copyright notice
  OBLIGATION_KIND_OTHER            = 6;  // Custom requirement, described in Obligation.detail
}

// ObligationTrigger — When the obligation activates.
enum ObligationTrigger {
  OBLIGATION_TRIGGER_UNSPECIFIED        = 0;  // unset — rejected at ingest
  OBLIGATION_TRIGGER_ON_USE             = 1;  // Triggered on any use
  OBLIGATION_TRIGGER_ON_DISTRIBUTION    = 2;  // Triggered when copies are distributed
  OBLIGATION_TRIGGER_ON_NETWORK_SERVICE = 3;  // Triggered when served over a network (AGPL)
  OBLIGATION_TRIGGER_ON_DERIVATIVE      = 4;  // Triggered when a derivative work is produced
}

// License — Identifies the governing license document for a LicenseTerm.
message License {
  // uri_digest is REQUIRED whenever uri is present — any semantics. Without a
  // pinned digest the referenced document can be swapped after the offer is
  // signed; the agent must be able to verify the bytes it fetches.
  option (buf.validate.message).cel = {
    id: "license.digest_required_with_uri"
    message: "uri_digest is required whenever uri is set"
    expression: "this.uri == '' || this.uri_digest != ''"
  };

  // Canonical identity of the license document (RFC 3986). MUST NOT be
  // URL-validated — data-labels TDL identifiers use non-URL schemes.
  // For REFERENCE_ONLY terms this is the authoritative specification.
  // Examples:
  //   "https://creativecommons.org/licenses/by/4.0/"
  //   "https://techcrunch.com/licensing/ai-terms-2026"
  //
  // "MUST NOT URL-validate" means do not REJECT non-URL schemes — it does NOT
  // mean fetch blindly. A consumer that dereferences this URI MUST apply the
  // SSRF countermeasures in the security threat model (T-LIC-1): scheme
  // allowlist, block loopback/private/metadata addresses (resolve-then-check),
  // fetch via an egress proxy, and treat the response as untrusted content.
  // Verify the fetched bytes against `uri_digest` before use.
  optional string uri = 1;

  // Stable short identifier: SPDX short-id ("GPL-3.0-only"), TollBit cuid,
  // or catalog doc-id. Used by agents and the vocab linter for known-license
  // lookup; SHARE_ALIKE derivatives default their scope_license to this.
  optional string id = 2;

  // Human-readable name (licenseType, schema.org node name).
  optional string name = 3;

  // Data-labels TDL: the document at uri is versioned and will not change.
  optional bool immutable = 4;

  // Cryptographic digest of the document at `uri`, in "method:hexdigest" form
  // (e.g. "sha256:9f86d081..."). Pins the referenced document so a consumer can
  // verify the bytes it fetches match what was offered; covered by the offer
  // signature, so it is tamper-evident end to end. REQUIRED whenever `uri` is
  // non-empty — any semantics, mutable or not: without a pinned digest a MitM
  // (or the publisher) can swap the document the agent reads. The Exchange pins
  // it at ingestion (computing it over the safely-fetched document, or
  // accepting a publisher-supplied value when uri is not HTTP-fetchable, e.g. a
  // non-URL TDL scheme).
  //
  // The method MUST be a collision-resistant hash — sha256, sha384, or sha512.
  // Legacy md5/sha1 are rejected on the wire: a forgeable digest would defeat
  // the swap-protection this field exists for. The CEL is STRUCTURE ONLY
  // (allowlisted prefix + matching hex length); presence (digest-when-uri) is
  // enforced at ingest.
  optional string uri_digest = 5 [
    (buf.validate.field).string.pattern = "^(sha256:[0-9a-f]{64}|sha384:[0-9a-f]{96}|sha512:[0-9a-f]{128})?$"
  ];
}

// Restriction — A single constraint on one licensing dimension.
//
// Restrictions model allowed and prohibited values on one axis (function,
// geography, or user-type). They are validated and normalized at ingest and
// RIDE ON THE OFFER: the AGENT is the responsible party — it self-selects the
// term whose restrictions it can honour and bears compliance, and enforcement
// happens downstream at accept → report → reconcile. Restrictions are NOT an
// Exchange-side gate the requester must pass to see a term.
//
// An Exchange or Broker MAY, purely as a CONVENIENCE, pre-filter the offers it
// returns against the limits the query states in ResourceQuery.acceptable_restrictions
// (the same RestrictionKind axes/vocabulary the terms use) — e.g. an agent that
// only wants US-eligible content can ask the Exchange to skip the rest so it
// doesn't pay to discover offers it would never accept. That filter is advisory and
// optional: a different Broker may not apply it, and it is a recommendation
// matched to the request, never an enforcement verdict. When an Exchange does
// drop offers this way it MAY signal it via OfferAbsenceReason.RESTRICTION_FILTERED
// (with the axes in OfferGroup.restriction_filters). Term visibility is otherwise
// gated only by resource_id/URI and delegation scope coverage — see
// LicenseTerm.scopes.
//
// Reading a restriction:
//   A value is in-scope when it matches at least one permitted[] token
//   AND matches none of the prohibited[] tokens.
//   Empty permitted[] = any value is permitted on this axis.
//   Empty prohibited[] = nothing is explicitly prohibited.
//
// Vocabulary sources (authored on the RestrictionKind enum values via
// (ramp.v1.vocab_enum); the functiontokens / geographytokens / usertypes
// constants + IsRegistered derive from them):
//   FUNCTION  — RSL 1.0 AI-use vocabulary + established IP/copyright terms
//   GEOGRAPHY — ISO 3166-1 alpha-2 (structural) + the specials *, EU, EEA
//   USER_TYPE — RAMP user/organization categories
message Restriction {
  // A token cannot be both permitted and prohibited on the same axis.
  option (buf.validate.message).cel = {
    id: "restriction.permitted_prohibited_disjoint"
    message: "a token cannot appear in both permitted and prohibited"
    expression: "this.permitted.all(p, !(p in this.prohibited))"
  };

  // Which dimension this restriction applies to.
  RestrictionKind kind = 1 [(buf.validate.field).enum = {not_in: [0]}];

  // Tokens allowed on this axis. Empty = all permitted.
  // For FUNCTION: "ai-input", "ai-train", "search", "editorial", "commercial", …
  // For GEOGRAPHY: "US", "DE", "EU", "EEA", "*", …
  // For USER_TYPE: "individual", "academic", "commercial_entity", …
  repeated string permitted = 2 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9._:*-]+$"
  ];

  // Tokens blocked on this axis. Takes precedence over permitted[].
  repeated string prohibited = 3 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9._:*-]+$"
  ];

  // Fail-closed by default. When false (the default), this restriction is
  // BINDING: an agent that cannot evaluate every token in it — including an
  // unknown vendor token — MUST decline the term. Set advisory = true to
  // downgrade an unverifiable restriction to non-blocking. This deliberately
  // inverts the COSE-`crit` opt-in default: a license restriction a consumer
  // does not understand should stop it, not be silently ignored.
  bool advisory = 4;
}

// Quota — A usage cap that gates whether this LicenseTerm remains valid.
//
// Quotas limit how much a licensee may consume before the term expires or
// must be renegotiated. They are NOT billing quantities — billing is in Pricing.
//
// The metric vocabulary is authored ONLY in the (ramp.v1.vocab) entries on
// Quota.metric below; the quotametrics constants + IsRegistered derive from it.
message Quota {
  // The unit being capped — an open vocabulary axis.
  //
  // The (ramp.v1.vocab) entries below are the SOLE authored source of the
  // registered bare metric tokens. A buf plugin reads them structurally and
  // emits the quotametrics constants + IsRegistered; ingest enforces membership
  // from those. The CEL is STRUCTURE ONLY (non-empty bare token or
  // vendor:namespaced) — it never lists the tokens, so it cannot drift.
  //
  // Token meanings:
  //   display-words      Words of content text rendered to an end user.
  //   impressions        Times the content is displayed to an end user.
  //   tokens             LLM output tokens generated using this content.
  //   input-tokens       LLM input tokens consumed from this content.
  //   units-manufactured Physical units manufactured from this design/pattern.
  //   accesses           Distinct content access / retrieval events.
  //   copies             Digital or physical copies produced.
  //   seats              Distinct named users licensed to access the content.
  string metric = 1 [
    (ramp.v1.vocab_package) = "quotametrics",
    (ramp.v1.vocab) = "display-words",
    (ramp.v1.vocab) = "impressions",
    (ramp.v1.vocab) = "tokens",
    (ramp.v1.vocab) = "input-tokens",
    (ramp.v1.vocab) = "units-manufactured",
    (ramp.v1.vocab) = "accesses",
    (ramp.v1.vocab) = "copies",
    (ramp.v1.vocab) = "seats",
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^([a-z0-9-]+|[A-Za-z0-9._-]+:[A-Za-z0-9._-]+)$"
  ];

  // Maximum allowed value in the given window. A quota of 0 grants
  // nothing — express "no access" by omitting the term, not a zero quota.
  int64 limit = 2 [(buf.validate.field).int64.gte = 1];


  // Time window over which the limit accumulates.
  QuotaWindow window = 3 [(buf.validate.field).enum = {not_in: [0]}];
}

// Obligation — A post-use behavioral requirement attached to a LicenseTerm.
//
// Examples:
//   Attribution on display: cite the author whenever content is shown to a user.
//   Share-alike on derivative: AI-generated content that incorporates this work
//     must be released under the same license.
//   Notice on distribution: include the copyright notice when distributing copies.
message Obligation {
  // SHARE_ALIKE derivatives must name the license they inherit.
  option (buf.validate.message).cel = {
    id: "obligation.share_alike.requires_scope_license"
    message: "SHARE_ALIKE requires scope_license to identify a license (id or uri)"
    expression: "this.kind != ramp.v1.ObligationKind.OBLIGATION_KIND_SHARE_ALIKE || (has(this.scope_license) && (this.scope_license.id != '' || this.scope_license.uri != ''))"
  };

  // What the agent must do.
  ObligationKind kind = 1 [(buf.validate.field).enum = {not_in: [0]}];

  // When the obligation activates.
  ObligationTrigger trigger = 2 [(buf.validate.field).enum = {not_in: [0]}];

  // The license that derivatives must be released under. REQUIRED for
  // SHARE_ALIKE (rejected if absent), where it MUST identify a license — set
  // `id` (SPDX short-id, the common copyleft case, often the term's own
  // License.id) and/or `uri`. Because it is a License, a referenced `uri`
  // inherits the uri_digest swap-protection rule: a uri without a digest is
  // rejected, exactly as for any other license reference.
  optional License scope_license = 3;

  // Free-form detail: attribution string, notice file URI, etc.
  // OBLIGATION_KIND_OTHER without it → lint warning.
  optional string detail = 4;
}

// LicenseTerm — Universal licensing unit.
//
// One LicenseTerm describes one complete access arrangement for a resource.
// A resource carries zero or more terms; having multiple terms is the normal
// case (one per use category, user type, or commercial arrangement).
//
// The same LicenseTerm shape appears at ingestion (ResourceEntry.terms) and
// at emission (Offer.terms). The Exchange stores what the publisher pushed
// and surfaces it on discovery, so agents see the same terms the publisher
// declared — no translation or reformulation.
//
// Validation rules:
//   - Pricing MUST be present on EVERY term, regardless of semantics.
//     Absent Pricing → reject at ingest: an agent cannot act on a term with
//     no price. This holds for REFERENCE_ONLY too — its License governs the
//     human-readable terms, but the machine-readable price is still stated
//     here, not deferred to the document.
//   - model=FREE must be explicit. Absent Pricing ≠ free. A term may be FREE
//     under an arbitrary license; the agent still needs the price stated so it
//     knows the access is free rather than unpriced.
//   - REFERENCE_ONLY terms MUST carry a License with a non-empty uri. A
//     REFERENCE_ONLY term that references no document is meaningless → reject
//     at ingest.
//   - Restriction tokens are validated against the vocab registry.
//     Unknown tokens produce a PushResourcesResponse.warnings[] entry
//     but do NOT cause rejection (forward-compatible).
message LicenseTerm {
  // A REFERENCE_ONLY term MUST carry a License with a non-empty uri — a term
  // that defers to a document but references nothing is rejected.
  option (buf.validate.message).cel = {
    id: "license_term.reference_only.requires_uri"
    message: "REFERENCE_ONLY terms must carry a license with a non-empty uri"
    expression: "this.semantics != ramp.v1.TermSemantics.TERM_SEMANTICS_REFERENCE_ONLY || (has(this.license) && this.license.uri != '')"
  };
  // At most one Restriction per axis — restrictions on the same kind are
  // AND-combined, so duplicates are an authoring error.
  option (buf.validate.message).cel = {
    id: "license_term.one_restriction_per_kind"
    message: "at most one restriction is allowed per kind"
    expression: "this.restrictions.all(r, this.restrictions.filter(o, o.kind == r.kind).size() <= 1)"
  };

  // Governing license document. Authoritative for REFERENCE_ONLY terms, which
  // MUST carry a License with a non-empty uri — a REFERENCE_ONLY term that
  // references nothing is rejected at ingest.
  optional License license = 1;

  // How to interpret the machine fields.
  TermSemantics semantics = 2 [(buf.validate.field).enum = {not_in: [0]}];

  // Usage restrictions (function, geography, user-type).
  // Multiple restrictions are AND-combined — the agent must satisfy all of them.
  repeated Restriction restrictions = 3;

  // Usage caps. The agent must not exceed any individual Quota.
  repeated Quota quotas = 4;

  // Post-use behavioral requirements.
  repeated Obligation obligations = 5;

  // Pricing for this term. REQUIRED for every term regardless of semantics —
  // an agent cannot act on a priceless term, so absent Pricing is a validation
  // error at ingest. model = FREE must be stated explicitly (absent Pricing is
  // not free). A REFERENCE_ONLY term states its price here too; its License
  // governs the human-readable terms but does not replace the machine-readable
  // price.
  optional Pricing pricing = 6 [(buf.validate.field).required = true];

  // Delegation scope-gating: the Exchange returns this term to an agent iff the
  // agent's delegation grant covers ALL of these scopes (AND-semantics).
  // Empty = public. A subscription term is Pricing{model:FREE} +
  // scopes:["subscription:..."].
  //
  // Coverage uses the SAME matching rule as Requester/delegation scopes:
  // segment-wise (":" separated), each granted segment must equal the
  // corresponding required segment or be "*", a terminal "*" matches all
  // remaining segments, and there is NO implicit prefix match (a grant
  // narrower than the requirement does not cover it). "dist:*" covers
  // "dist:US" and "dist:US:CA"; "dist" covers only "dist". There is exactly
  // one scope-matching algorithm across the protocol.
  repeated string scopes = 7 [(buf.validate.field).repeated.max_items = 64];

  // Informational human-readable name for this sub-part (sub-part terms).
  optional string part_label = 8;
}

// Preview — Lightweight resource preview for offer evaluation.
//
// The Exchange holds URLs (50–200 bytes per preview); the provider's
// CDN serves the actual bytes. This follows the universal pattern:
// Shutterstock (multi-size thumbnail URLs), Spotify (preview_url to
// 30s clip), IIIF (parameterized image URLs), OpenRTB (img.url + dims).
//
// Previews are free to fetch — no RAMP transaction required. They are
// the equivalent of looking at a book cover before buying. Providers
// MAY watermark visual previews or truncate text/audio previews.
//
// The Exchange populates preview URLs during catalog ingestion. Preview
// URLs MAY be signed with a short TTL to prevent hotlinking, or public
// (provider's choice). Agents fetch previews only when evaluating
// offers, not on every discovery query.
message Preview {
  // URL to a preview asset (thumbnail, clip, snippet, sample).
  // Served by the provider's CDN, not by the Exchange.
  string url = 1;

  // MIME type of the preview.
  // Examples: "image/jpeg", "image/webp", "audio/mpeg", "video/mp4",
  //           "text/plain", "application/json"
  string media_type = 2;

  // Dimensions in pixels (for images and video).
  optional int32 width = 3;
  // Height in pixels (images and video)
  optional int32 height = 4;

  // Duration in seconds (for audio and video clips).
  optional int32 duration = 5;

  // Size category hint. Agents use this to select the right preview
  // without fetching all of them.
  // Standard values:
  //   "thumbnail"  — smallest useful preview (100–150px or 5–10s)
  //   "preview"    — mid-size for evaluation (300–500px or 15–30s)
  //   "sample"     — larger / more detailed (for data: 1–3 sample records)
  optional string size = 6;
}

// Pricing — Terms for a resource offer.
//
// Providers set prices in their preferred model. The Exchange
// normalizes to unit cost (effective cost per unit) for cross-exchange
// comparison — analogous to eCPM in programmatic advertising.
// Unit cost is denominated in the Exchange's base currency.
//
// Fields: model, rate, currency, unit_cost, estimated_quantity,
// license_duration_months, unit, metering.
message Pricing {
  // Cross-field structural rules (protovalidate, OR form — CEL has no implies):
  //   PER_UNIT ⇒ unit must be set; FREE ⇒ rate must be 0.
  // Registry membership (a bare unit must be one of the registered tokens) is
  // NOT here — it is checked at ingest via the generated IsRegistered, so the
  // CEL never re-lists the vocabulary and cannot drift from it.
  option (buf.validate.message).cel = {
    id: "pricing.per_unit.requires_unit"
    message: "unit is required when model is PER_UNIT"
    expression: "this.model != ramp.v1.PricingModel.PRICING_MODEL_PER_UNIT || this.unit != ''"
  };
  option (buf.validate.message).cel = {
    id: "pricing.free.zero_rate"
    message: "rate must be 0 (or empty) when model is FREE"
    expression: "this.model != ramp.v1.PricingModel.PRICING_MODEL_FREE || this.rate == '' || this.rate.matches('^0+([.]0+)?$')"
  };

  // Provider's pricing model.
  PricingModel model = 1 [(buf.validate.field).enum = {not_in: [0]}];

  // Price in the provider's model, as an exact decimal string — e.g. "0.05" =
  // $0.05 per article. NOT a float: money is decimal to avoid binary rounding and
  // to allow arbitrary sub-cent precision (e.g. "0.0001234"). Denominated in `currency`.
  string rate = 2 [(buf.validate.field).string.pattern = "^([0-9]+([.][0-9]+)?)?$", (buf.validate.field).string.max_len = 32];

  // ISO 4217 currency code (e.g. "USD", "EUR").
  string currency = 3;

  // Normalized cost per unit — the universal comparison metric, exact decimal string.
  // For text: cost per token. For video: cost per second.
  // For data: cost per record. For APIs: cost per call.
  // Denominated in the Exchange's base_currency (from its WellKnownManifest).
  optional string unit_cost = 4 [(buf.validate.field).string.pattern = "^([0-9]+([.][0-9]+)?)?$", (buf.validate.field).string.max_len = 32];

  // Estimated quantity in the metering unit.
  // For text: token count. For video: duration in seconds.
  // For documents: page count. For data: record count.
  optional int32 estimated_quantity = 5;

  // License duration in months. How long the granted access remains valid.
  optional int32 license_duration_months = 7;

  // Metering basis — the "per what" of PER_UNIT pricing. REQUIRED when
  // model = PER_UNIT. Custom units namespace as "vendor:unit". Ignored for
  // FREE / FLAT.
  //
  // The (ramp.v1.vocab) entries below are the SOLE authored source of the
  // registered bare tokens. A buf plugin reads them structurally and emits the
  // pricingunits constants + IsRegistered; ingest enforces membership from
  // those. The CEL is STRUCTURE ONLY (empty / bare-form / vendor:namespaced) —
  // it never lists the tokens, so it cannot drift from the registry.
  optional string unit = 8 [
    (ramp.v1.vocab_package) = "pricingunits",
    (ramp.v1.vocab) = "fetches",  (ramp.v1.vocab) = "accesses", (ramp.v1.vocab) = "tokens",
    (ramp.v1.vocab) = "calls",    (ramp.v1.vocab) = "pages",    (ramp.v1.vocab) = "seconds",
    (ramp.v1.vocab) = "minutes",  (ramp.v1.vocab) = "records",  (ramp.v1.vocab) = "streams",
    (ramp.v1.vocab) = "images",
    (ramp.v1.vocab) = "seats",    (ramp.v1.vocab) = "units-manufactured",
    (ramp.v1.vocab) = "characters", (ramp.v1.vocab) = "bytes",  (ramp.v1.vocab) = "items",
    (ramp.v1.vocab) = "sq-km",
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^([a-z0-9-]+|[A-Za-z0-9._-]+:[A-Za-z0-9._-]+)?$"
  ];

  // How usage is tracked for billing reconciliation.
  // Absent = PRICING_METERING_ONLINE (default real-time tracking).
  // NONE = one-time perpetual sale; no ReportUsage required after ExecuteTransaction.
  // OFFLINE_SELF_REPORTED = agent self-reports physical-world consumption.
  optional PricingMetering metering = 9;
}

// PricingModel — the charging STRUCTURE only (a genuinely closed, small set;
// changes far less than yearly, so an enum is correct per Google AIP-126). The
// open-ended metering basis ("per what") is NOT enumerated here — it lives in
// Pricing.unit as a registry-governed vocabulary (the (ramp.v1.vocab) field
// options on Pricing.unit; see vocab.proto).
// Subscription = model=FREE + scopes (see LicenseTerm); attribution/contribution
// are obligations (see ObligationKind); revenue-share settlement is off-protocol.
enum PricingModel {
  PRICING_MODEL_UNSPECIFIED = 0;  // unset — zero allowed on WellKnownManifest.pricing_models_supported (capability list); rejected (not_in:[0]) as the Pricing.model discriminator (omission cannot default to FREE)
  PRICING_MODEL_FREE        = 1;  // no charge; rate must be 0 (state FREE explicitly — absent Pricing is not free)
  PRICING_MODEL_PER_UNIT    = 2;  // rate per Pricing.unit; unit REQUIRED (registered token or vendor:custom)
  PRICING_MODEL_FLAT        = 3;  // one-time flat fee; rate is the total, no unit
}

// PricingMetering — How usage is tracked for billing reconciliation.
//
// ONLINE (default, field absent or = 0): Exchange tracks usage events in real time.
// NONE: one-time transaction; no ongoing metering required (stock image perpetual
//   license, CAD file one-time download). Billing_id is issued at ExecuteTransaction
//   and the ledger entry is closed — no ReportUsage required.
// OFFLINE_SELF_REPORTED: agent self-reports consumption (e.g., units-manufactured
//   for 3D-printed items from a licensed design). Exchange audits; metering is not
//   possible online because the event occurs in the physical world.
enum PricingMetering {
  PRICING_METERING_ONLINE                = 0;  // Default. Exchange tracks usage events in real time. `ReportUsage` is required.
  PRICING_METERING_NONE                  = 1;  // One-time perpetual sale. No ongoing metering; `billing_id` is issued at `ExecuteTransaction` and the ledger entry is closed. No `ReportUsage` required.
  PRICING_METERING_OFFLINE_SELF_REPORTED = 2;  // Agent self-reports physical-world consumption (e.g. units manufactured from a licensed design). Exchange audits.
}

enum DeliveryMethod {
  DELIVERY_METHOD_UNSPECIFIED = 0;  // unset — output/optional and capability-list; zero is a valid not-applicable/unset state
  // Exchange returns resource inline or via its own endpoint.
  DELIVERY_METHOD_DIRECT = 1;
  // Exchange returns access info (signed URL, token) for retrieval
  // from a Resource Owner / Resource Delivery Endpoint.
  DELIVERY_METHOD_INSTRUCTIONS = 2;
  // Resource delivered via real-time streaming connection (WebSocket, SSE, gRPC stream).
  // The signed URL points to a streaming endpoint. Agent connects and receives
  // continuous data for the duration of the session.
  DELIVERY_METHOD_STREAMING = 3;
}

// ============================================================================
// Requester Identity
//
// Universal actor model. The requester can be any entity that needs metered
// resource access: AI agent, human using a tool, enterprise service account,
// research pipeline, compliance monitor.
//
// Identity is layered:
//   1. Ed25519 signature proves possession of a registered key
//   2. Scopes declare what the requester is entitled to access
//   3. Delegation chain proves who authorized this requester
//
// The Exchange uses scopes to filter the catalog:
//   - Resources outside the requester's scopes are NOT returned (not even
//     as OfferAbsenceReason — the requester never learns they exist)
//   - Subscription entitlements are scopes: "subscription:marketdata-2026"
//     tells the Exchange to return zero-cost subscription offers
//
// Open market: subscription providers mint delegation tokens with scopes.
// Enterprise: IAM systems mint delegation tokens with role-derived scopes.
// Same mechanism, different trust domain.
// ============================================================================

// Requester — Universal identity for any RAMP client.
//
// Carries identity and entitlements ONLY — who is asking and what they are
// entitled to (scopes, delegation). What they are asking for (uris) and the
// limits they will operate within (acceptable_restrictions) belong to the ask,
// not the identity, and live on ResourceQuery / DiscoveryRequest. The Exchange
// verifies identity via the RFC 9421 request signature, then filters its
// catalog by the requester's scopes. Billing needs nothing from this message:
// the Exchange resolves the caller's account (RegisterResponse.billing_ref)
// from the verified signature, never from anything the caller sends.
message Requester {
  // Unique requester identifier (e.g., "agent-research-bot-001").
  string id = 1;

  // Domain the requester belongs to — used for public key lookup.
  // Keys published at {domain}/.well-known/ramp.json (WellKnownManifest, role=ROLE_AGENT).
  string domain = 2;

  // What kind of entity is making this request.
  RequesterType type = 3 [(buf.validate.field).enum = {not_in: [0]}];


  // Human-readable name (e.g., "Acme Research Assistant").
  optional string name = 4;

  // Entitlement scopes. Declare what the requester can access.
  //
  // The Exchange filters its catalog to resources matching these scopes.
  // Resources outside the scopes are not returned — the requester never
  // learns they exist. This is the enforcement mechanism for both enterprise
  // RBAC and open-market subscription entitlements.
  //
  // Scope format: colon-separated segments, "{domain}:{permission}" or
  // "{profile}:{permission}", optionally multi-segment ("dist:US:CA");
  // matching is segment-wise per the rule below (no implicit hierarchy).
  // Examples:
  //   "credit:read"                — can access credit reports
  //   "subscription:marketdata-2026" — has active MarketData subscription
  //   "academic:*"                 — full access to academic resources
  //   "internal:reports"           — can access internal reports
  //   "*"                         — unrestricted (public Exchange default)
  //
  // Matching is SEGMENT-WISE (":" separated). A granted scope G covers a
  // required scope R iff, segment by segment, each G segment equals the
  // corresponding R segment or is "*"; a terminal "*" matches all remaining
  // segments. There is NO implicit prefix match, and a grant NARROWER than
  // the requirement does not cover it (G must be equal-to-or-broader than R).
  // Examples: "dist:*" covers "dist:US" and "dist:US:CA"; "dist:US:*" covers
  // "dist:US:CA" but not "dist:EU"; bare "dist" covers only "dist"; granted
  // "dist:US:CA" does NOT cover required "dist:US"; "*" covers everything.
  // This same rule governs LicenseTerm.scopes — one algorithm protocol-wide.
  //
  // When empty, Exchange applies its default access policy (typically
  // returns all publicly available resources).
  repeated string scopes = 6 [(buf.validate.field).repeated.max_items = 64];

  // Request authentication is handled at the HTTP layer via RFC 9421
  // HTTP Message Signatures (alg=ed25519). The Requester's public key
  // is published at {domain}/.well-known/ramp.json as a WellKnownManifest
  // (role=ROLE_AGENT) with inline JWK keys.

  // Optional delegation — present when the requester acts on behalf of
  // another entity (user, organization, upstream agent).
  optional Delegation delegation = 7;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// RequesterType — What kind of entity is making the request.
enum RequesterType {
  REQUESTER_TYPE_UNSPECIFIED = 0;  // unset — rejected at ingest
  // Autonomous AI agent (LLM, RAG system, research bot).
  REQUESTER_TYPE_AGENT = 1;
  // Human using an AI-powered tool (copilot, assistant).
  REQUESTER_TYPE_HUMAN_TOOL = 2;
  // Enterprise service account (automated pipeline, cron job).
  REQUESTER_TYPE_SERVICE = 3;
  // Agent acting on behalf of a user (delegated identity).
  REQUESTER_TYPE_DELEGATED = 4;
  // Research pipeline (batch data collection, model training).
  REQUESTER_TYPE_RESEARCH = 5;
}

// Delegation — Scoped, time-limited, spend-capped credential.
//
// The token is an opaque, signed credential. The format is a JWT (token_format
// "jwt"); the field stays open for a future format. Its claims are the
// AUTHORITATIVE source of the grant; the
// plaintext fields below (scopes, expires_at, max_spend_cents, …) are a
// convenience mirror the Exchange MAY use for fast pre-filtering before it
// verifies the token.
//
// Holder binding (the load-bearing property). The grant is bound to a holder key
// via the RFC 7800 `cnf` confirmation claim — `cnf.jkt`, the RFC 7638 JWK
// thumbprint of the holder's key. Verification MUST check that the key signing
// the request (RFC 9421) hashes to that thumbprint; a token possessed without
// the matching private key is rejected. This is what makes a leaked token NOT
// bearer-usable. Delegation is a chain of cnf-linked JWTs: a principal narrows a
// grant by issuing a child JWT (cnf = the next holder, scopes ⊆ parent), signed
// by the key the parent's cnf named — the chain-linkage invariant. Verifiers
// need only the root issuer's public key; intermediate keys ride inside the
// chain (JOSE header `jwk`), so verification is offline.
//
// The claim schema is a small registered vocabulary — see the RAMP
// delegation-claims profile in the auth spec. All claims are OPTIONAL except the
// holder binding (cnf). Vendors MAY add namespaced claims (their own "vendor:"
// namespace; "ramp_"-prefixed names are reserved for the registered vocabulary
// and MUST NOT be redefined); any constraint a verifier cannot evaluate is
// binding by default (fail closed) unless the issuer marks it advisory —
// mirroring Restriction.advisory.
//
// Scope/time/spend caps are defense-in-depth that bound the blast radius only in
// the residual case where the holder's signing key is also compromised; the
// primary protection against theft is the holder binding above.
message Delegation {
  // Who granted this delegation (domain for public key lookup).
  string principal_domain = 1;

  // Principal's identifier (e.g., "user@acme.com", "marketdata.example.com").
  string principal_id = 2;

  // Scopes granted by this delegation. MUST be a subset of the
  // principal's own scopes (attenuation — can only narrow, not widen).
  repeated string scopes = 3;

  // When this delegation expires. Exchange MUST reject expired tokens.
  google.protobuf.Timestamp expires_at = 4;

  // Maximum spend in currency minor units (e.g., cents for USD).
  // Exchange tracks cumulative spend against this cap.
  optional int64 max_spend_cents = 5;

  // Maximum number of accesses allowed under this delegation.
  // Exchange tracks cumulative access count against this cap.
  // Deny with DENIAL_REASON_QUOTA_EXCEEDED when count >= limit.
  // For subscriptions with "10,000 accesses/month", this carries the ceiling.
  optional int32 max_accesses = 9;

  // Quota reset period. How often the access/spend counters reset.
  // Example: 30 days for monthly subscriptions — "2592000s" on the wire
  // (proto-JSON encodes Duration as seconds; "720h" is not accepted).
  // When absent, the quota is lifetime (bounded only by expires_at).
  optional google.protobuf.Duration quota_period = 10;

  // Token bytes. A JWT (base64url-encoded JWS).
  bytes token = 6;

  // Token format: "jwt" (default). Empty is treated as "jwt". The field stays
  // open for a future format.
  string token_format = 7;

  // Optional: URI for real-time revocation checking.
  // Exchange MAY check this for high-value transactions.
  // Not checked for routine low-value access (performance tradeoff).
  optional string revocation_uri = 8;

  // Token issuer. OIDC issuer URL or GNAP grant server URL.
  // Exchange uses this for JWT validation (OIDC discovery → JWKS)
  // or GNAP token introspection.
  optional string issuer = 11;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// C2PAStatus — Summary validation status of a C2PA content credentials manifest.
//
// Populated by the Exchange or a C2PA verification vendor after validating
// the manifest against the C2PA specification (§15 Validation Algorithm).
// Maps to C2PA's three validation states: well-formed, valid, trusted.
//
// Trust is determined by the C2PA Trust List (curated X.509 roots).
// RAMP bridges this trust via ResourceAttestation: a RAMP-trusted
// verification vendor validates the C2PA manifest and publishes
// the results as attestation claims signed with Ed25519.
enum C2PAStatus {
  C2PA_STATUS_UNSPECIFIED = 0;  // unset — output/optional; zero is a valid not-applicable/unset state
  // Manifest is valid AND signer certificate chains to a C2PA Trust List root.
  // Highest assurance: provenance is cryptographically verified by a trusted CA.
  C2PA_STATUS_TRUSTED = 1;
  // Manifest is structurally correct and signature verifies, but signer
  // certificate does NOT chain to a C2PA Trust List root. The content
  // has provenance, but the signer is not institutionally vouched for.
  C2PA_STATUS_VALID = 2;
  // Manifest is present but validation failed (signature mismatch,
  // malformed JUMBF, certificate expired, hard binding broken).
  C2PA_STATUS_INVALID = 3;
  // Content was checked and has no C2PA manifest.
  C2PA_STATUS_ABSENT = 4;
}

// ResourceMutability — Signals whether resource content changes over time.
//
// Drives hash verification behavior and Broker expectations.
// Cross-cutting: validated across 18 use cases spanning 10 industries.
//
// Examples by level:
//   STATIC:  NYT article, academic paper, patent, EU regulation, podcast episode
//   DYNAMIC: D&B credit report, DrugBank interactions, satellite catalog, news article (corrections)
//   LIVE:    MarketData quote stream, NPR live broadcast, news monitoring feed
enum ResourceMutability {
  RESOURCE_MUTABILITY_UNSPECIFIED = 0;  // unset — the Exchange defaults to `STATIC` at Offer build; an explicit `UNSPECIFIED` is rejected on `ResourceEntry.resource_mutability` and the Offer's `ResourceIdentity.resource_mutability` (both `{not_in:[0]}`)
  // Content is immutable. Hash computed at offer time will match at delivery time.
  // Agent SHOULD verify content_hash on delivery. Mismatch is disputable.
  RESOURCE_MUTABILITY_STATIC = 1;
  // Content changes between offer generation and agent fetch.
  // Hash reflects state at offer time — mismatch is expected, not disputable.
  // Offer.data_as_of indicates when the snapshot was taken.
  RESOURCE_MUTABILITY_DYNAMIC = 2;
  // Content does not exist at offer time (real-time streaming).
  // No content_hash is applicable. The "resource" is the stream endpoint/channel.
  // Metering is time-based (per-minute, per-hour).
  RESOURCE_MUTABILITY_LIVE = 3;
}

// ============================================================================
// Transaction (Steps 4-5)
// ============================================================================

// AgentAcceptance — the agent's DETACHED acceptance signature over an accepted
// Offer. Distinct from the transport (RFC 9421) request signature:
// it is topology-independent and content-bound, so it stays valid no matter how
// many brokers relay the request, and binds the agent to THIS specific offer +
// requester + transaction. It travels in the execute body alongside the
// reflected Offer; the Exchange verifies it and binds the delivery URL to the
// agent's key (RFC 7638 thumbprint of the acceptance key).
//
// `signature` is a hex-encoded detached Ed25519 signature (NOT a JWS) over the
// CANONICAL SIGNING form of `AgentAcceptancePayload` — RFC 8785 JCS over canonical
// proto-JSON, defined once on Offer.signature above and applying verbatim here —
// the same hex/Ed25519 convention the SDK uses for Offer.signature.
// `signature_algorithm` is "EdDSA".
message AgentAcceptance {
  // Hex-encoded detached Ed25519 signature over the canonical AgentAcceptancePayload
  // bytes (see the canonical-signing definition on Offer.signature).
  string signature = 1 [(buf.validate.field).string.min_len = 1];

  // Signature algorithm; "EdDSA" for Ed25519.
  string signature_algorithm = 2;
}

// AgentAcceptancePayload — the canonical signing structure for AgentAcceptance.
// It is NEVER sent on the wire; it exists solely so the signer (SDK) and the
// verifier (Exchange) derive BYTE-IDENTICAL signed bytes from the same proto
// schema. This message fixes the FIELD SET; the byte layout is the canonical
// signing form defined on Offer.signature — RFC 8785 JCS over canonical
// proto-JSON with the pinned option set. Underspecifying either half is the top
// cross-implementation drift risk, so both are pinned normatively.
//
// Field provenance when building the payload for an execute request:
//   - offer_sig         = the accepted Offer.signature (the Exchange's hex
//                         signature; transitively binds pricing, terms,
//                         expires_at, and — via the offer — the issuing Exchange)
//   - requester_id      = TransactionRequest.requester.id
//   - requester_domain  = TransactionRequest.requester.domain
//   - idempotency_key   = TransactionRequest.idempotency_key
// For batch mode, requester_* and idempotency_key come from the ENCLOSING
// TransactionRequest (a TransactionItem carries neither); offer_sig is the
// per-item Offer.signature.
message AgentAcceptancePayload {
  // The accepted Offer's signature (Offer.signature). Anchors the whole signed
  // offer without re-serializing its terms/pricing/expiry.
  string offer_sig = 1;

  // Requester identity (Requester.id) the acceptance is bound to.
  string requester_id = 2;

  // Requester domain (Requester.domain) the acceptance is bound to.
  string requester_domain = 3;

  // The transaction's idempotency key — binds the acceptance to a single
  // execute so it cannot be replayed under a different transaction.
  string idempotency_key = 4;
}

// TransactionRequest — Commit to one or more offers.
//
// After selecting offers, the caller commits by sending this to the
// Exchange. Supports both single-offer and batch (multi-offer) modes.
// The Exchange validates eligibility, authorizes billing, creates
// delivery, and logs each transaction.
message TransactionRequest {
  // A transaction carries one or more items (items-only):
  // single-offer mode was removed — a single offer is the degenerate 1-element
  // `items` list.

  // Protocol version
  string ver = 1;

  // Idempotency key (REQUIRED). The server MUST dedupe on this: a replay returns
  // the original result rather than re-executing. The transaction's durable
  // identity is the Exchange-assigned transaction_id in the response.
  // Uniqueness is scoped to the verified RFC 9421 signer: the server dedupes per
  // (authenticated caller, key), never globally, so a key chosen by one caller
  // cannot collide with another's cached result.
  string idempotency_key = 2 [
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  // Requester identity — forwarded for authorization and audit.
  Requester requester = 4;

  // The offers committed in this request (REQUIRED, min 1), each carrying its
  // own reflected signed Offer + detached acceptance. A single offer is the
  // degenerate 1-element list. The Exchange verifies each item's
  // `offer.signature` (which covers pricing, terms, and expires_at) over the
  // presented bytes against its own key — stateless, self-contained bearer
  // tokens, with no reconstruct-from-catalog.
  repeated TransactionItem items = 7 [(buf.validate.field).repeated.min_items = 1];

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// TransactionItem — A single offer commitment within a batch transaction.
message TransactionItem {
  // The FULL signed Offer for this batch entry, reflected back exactly as
  // received at discovery. The Exchange verifies `offer.signature` over these
  // presented bytes — stateless, no reconstruct-from-catalog. REQUIRED: every
  // batch item carries its offer.
  Offer offer = 3 [(buf.validate.field).required = true];

  // The agent's detached acceptance signature over this item's `offer`.
  // Optional on the wire; the Exchange enforces presence per
  // item at the service layer for relayed batches. Signed bytes = the canonical
  // AgentAcceptancePayload form, with requester_* and idempotency_key
  // taken from the ENCLOSING TransactionRequest and offer_sig = offer.signature.
  optional AgentAcceptance agent_acceptance = 4;
}

// TransactionResponse — Exchange confirms the transaction(s).
//
// Items-only: every per-result datum lives in `items`
// (one TransactionResultItem per committed offer, in original order); the
// top-level fields carry only the shared aggregate state. A single offer is the
// degenerate 1-element `items`. The per-item denials remain in-body on
// TransactionResultItem as partial results of a successful request.
message TransactionResponse {
  // Protocol version
  string ver = 1;

  // Identity that a delivered retrieval_endpoint is bound to: the RFC 7638 JWK
  // Thumbprint of the agent's Ed25519 request-signing key (see "Retrieval-URL
  // identity binding" above). Shared across the request; set once.
  string agent_identity_hash = 10;

  // Per-offer results (one entry per committed item, in original order).
  repeated TransactionResultItem items = 13;

  // Aggregate cost across all items.
  optional Cost total_cost = 14;

  // Post-transaction quota state. Tells the agent how much quota remains
  // after this transaction. Enables proactive throttling ("1 access left").
  // Multiple entries for multi-dimensional quotas.
  repeated SubscriptionQuotaInfo subscription_quota = 17;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// TransactionResultItem — Result for a single offer in a batch transaction.
message TransactionResultItem {
  // The offer_id this result is for.
  string offer_id = 1;

  // Exchange-assigned transaction identifier.
  string transaction_id = 2;

  // Billing record identifier minted by the Exchange's billing adapter for
  // this transaction (not the account handle — see RegisterResponse.billing_ref).
  string billing_id = 3;

  // Resource title echoed from the Offer.
  optional string resource_title = 4;

  // Cost for this item.
  Cost cost = 5;

  // If under subscription, no per-request charge.
  optional string subscription_id = 6;

  // Computed per-unit cost for financial attribution on subscription transactions.
  // Even when cost.amount="0" (subscription), this field carries the value
  // of the access for accounting purposes (e.g., ASC 606 prepaid drawdown).
  optional Cost subscription_unit_value = 11;

  // Set if this specific item was denied (others may succeed).
  optional DenialReason denial_reason = 7;

  // When denial_reason = RESTRICTION_NOT_SATISFIED, the restriction axes the
  // request failed, in the same RestrictionKind vocabulary the terms use.
  repeated RestrictionKind restriction_mismatches = 13;

  // When retrieval_endpoint expires.
  optional google.protobuf.Timestamp expires_at = 8;

  // Signed retrieval URL for this item. Bound to the requesting agent's identity
  // via the parent TransactionResponse.agent_identity_hash (shared across all
  // batch items); expires at expires_at. Absent if this item was denied or its
  // delivery_method is not signed-URL-based.
  optional string retrieval_endpoint = 12;

  // How resource is delivered for this item.
  DeliveryMethod delivery_method = 9;

  // Reporting requirements for this item.
  optional ReportingObligation reporting_obligation = 10;
}

// Cost — Actual transaction cost.
message Cost {
  // Exact decimal string (not a float), e.g. "19.99". Denominated in `currency`.
  string amount = 1 [(buf.validate.field).string.pattern = "^([0-9]+([.][0-9]+)?)?$", (buf.validate.field).string.max_len = 32];
  string currency = 2;        // ISO 4217
  optional string unit_cost = 3 [(buf.validate.field).string.pattern = "^([0-9]+([.][0-9]+)?)?$", (buf.validate.field).string.max_len = 32];   // Effective cost per unit (decimal string)
}

// DenialReason — Standard vocabulary for transaction denial.
// Logged as enum values, not strings. Enables automated processing
// of denial patterns across the ecosystem.
enum DenialReason {
  DENIAL_REASON_UNSPECIFIED = 0;  // output enum; zero = not-applicable on TransactionResultItem.denial_reason, rejected (not_in:[0]) where set on TransactionDenial.reason
  DENIAL_REASON_BILLING_REF_INACTIVE = 1; // the requester's account (the billing_ref minted at Register) is not active / not recognized by the billing system
  DENIAL_REASON_INSUFFICIENT_BALANCE = 2; // Requester's balance too low
  DENIAL_REASON_RATE_LIMITED = 3;         // Too many requests
  DENIAL_REASON_CONTENT_UNAVAILABLE = 4;  // Resource no longer available
  DENIAL_REASON_RESTRICTION_NOT_SATISFIED = 5;  // Accepted term's restriction not satisfied by the request; the axes are in TransactionDenial.restriction_mismatches (single) / TransactionResultItem.restriction_mismatches (batch), same RestrictionKind vocabulary as the terms
  DENIAL_REASON_REPORTING_OVERDUE = 6;    // Requester has >20% overdue reports (MAY threshold)
  DENIAL_REASON_OFFER_EXPIRED = 7;        // Offer TTL exceeded
  DENIAL_REASON_SIGNATURE_INVALID = 8;    // Offer signature verification failed
  DENIAL_REASON_QUOTA_EXCEEDED = 9;       // Subscription access count exhausted for this period
  DENIAL_REASON_DELEGATION_INVALID = 10;  // Delegation missing, unverifiable, expired, holder binding failed, or scopes/caps do not cover the request
  DENIAL_REASON_SCOPE_INSUFFICIENT = 11;  // Requester scopes don't cover this resource

  // Entitlement family — subscription/entitlement access failures on a
  // subscription-gated offer. Finer-grained than DELEGATION_INVALID so callers
  // and operator tooling can triage each mode. These single-source the
  // Exchange's KindEntitlement* refusal taxonomy, which today is distinguishable
  // only by a server-side tag (all collapse to UNAUTHENTICATED on the wire).
  // Format-neutral: they classify a JWT/opaque entitlement-token failure, not a
  // format-specific one.
  DENIAL_REASON_ENTITLEMENT_MISSING = 12;            // no entitlement token presented for a subscription-only offer
  DENIAL_REASON_ENTITLEMENT_MALFORMED = 13;          // entitlement token failed to decode (malformed)
  DENIAL_REASON_ENTITLEMENT_EXPIRED = 14;            // entitlement token's validity window has passed
  DENIAL_REASON_ENTITLEMENT_WRONG_BUYER = 15;        // token's subscriber_org does not match the asserted requester
  DENIAL_REASON_SUBSCRIPTION_LAPSED = 16;            // the covering subscription contract has lapsed
  DENIAL_REASON_ENTITLEMENT_NOT_GRANTED = 17;        // subscription exists but no buyer-side grant ties this caller to it
}

// IngestionSource — How the catalog entry was discovered.
// Used by the Content Ingestion Pipeline to track provenance.
enum IngestionSource {
  INGESTION_SOURCE_UNSPECIFIED = 0;  // unset — output/optional; zero is a valid not-applicable/unset state
  INGESTION_SOURCE_RAMP_SITEMAP = 1;  // RAMP XML namespace in sitemap
  INGESTION_SOURCE_RSL = 2;            // RSL rsl.txt
  INGESTION_SOURCE_SITEMAP = 3;        // Standard sitemap.xml
  INGESTION_SOURCE_HTML_CRAWL = 4;     // HTML crawl + readability extraction
  INGESTION_SOURCE_CMS_API = 5;        // CMS REST API (WordPress, etc.)
  INGESTION_SOURCE_MANUAL = 6;         // Manual configuration
  INGESTION_SOURCE_CATALOG_API = 7;    // Third-party CatalogService push
}

// CatalogService — Optional RPC for providers/CMS/third-party intelligence
// providers to push resource metadata to an Exchange.
service CatalogService {
  // Push or update resource entries in the Exchange catalog.
  rpc PushResources(PushResourcesRequest) returns (PushResourcesResponse);
  // Remove resource entries.
  rpc RemoveResources(RemoveResourcesRequest) returns (RemoveResourcesResponse);
  // Trigger a full catalog refresh from configured sources.
  rpc RefreshCatalog(RefreshCatalogRequest) returns (RefreshCatalogResponse);
}

// BrokerService is the agent-facing gateway: it runs the broker discovery flow
// (discover → select offers) across one or more Exchanges on the caller's
// behalf and returns a single canonical DiscoveryResponse.
service BrokerService {
  // Resolve runs the broker discovery flow for the requested URIs/query: it
  // fans out to one or more Exchanges and returns the merged offers. It is pure
  // discovery — it selects and returns offers, never executes a transaction, so
  // it neither charges nor produces transaction denials. A denial is raised only
  // when the agent later calls ExchangeService.ExecuteTransaction on a selected
  // offer, and rides there on TransactionResponse.DenialReason.
  //
  // A result returns OK with offers populated on DiscoveryResponse.offer_groups
  // (one OfferGroup per requested URI). A request that ran but yielded nothing
  // licensable (not in catalog, no offers, entitlement/budget absence, upstream
  // temporarily unavailable) returns OK with DiscoveryResponse.absence_reason
  // set and empty offer_groups — "no result" is a successful answer, mirroring
  // DiscoverResources (ADR-019 §2). Here "authz" means resource entitlement
  // (→ OK + absence); transport authentication failures are a different axis and,
  // like malformed requests and internal faults, are non-OK transport errors
  // carrying an ErrorDetail.
  rpc Resolve(DiscoveryRequest) returns (DiscoveryResponse);
}

message PushResourcesRequest {
  // Protocol version
  string ver = 1;
  // Tenant identifier
  string tenant_id = 2;
  // Content entries to push
  repeated ResourceEntry entries = 3;

  // Identity of the caller (who is pushing this data).
  // The Exchange verifies this matches a registered CatalogService client.
  string caller_id = 4;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

message ResourceEntry {
  // Provider domain
  string domain = 1;
  // Content path
  string path = 2;
  // Content identifier
  optional string content_id = 3;
  // Content title
  optional string title = 4;
  // Word count
  optional int32 word_count = 5;
  // Estimated quantity in the metering unit
  optional int32 estimated_quantity = 6;
  // Content hash
  optional string content_hash = 7;
  // Hash algorithm
  optional string hash_method = 8;
  // How the entry was discovered
  optional IngestionSource source = 9;

  // Who provided this resource metadata. Creates audit trail for
  // "where did this catalog entry come from?"
  optional string provenance_source = 10;  // e.g., "gumgum.com", "ssp-alpha.com", "wordpress-plugin"

  // When this metadata was collected/generated.
  optional google.protobuf.Timestamp provenance_timestamp = 11;

  // Signed attestations about this resource entry.
  // Same semantics as Offer.attestations — see ResourceAttestation message
  // for verification levels and claim vocabulary. Attestations pushed via
  // CatalogService are verified at push time: the Exchange checks that
  // the attestation verifier is authorized to push for this provider
  // (via catalog_contributors in the provider's WellKnownManifest) and validates the
  // attestation signature against the verifier's public key from their
  // /.well-known/ramp.json endpoint (WellKnownManifest, role determined
  // by the verifier's operator).
  repeated ResourceAttestation attestations = 12;

  // Publisher-declared licensing terms for this resource.
  // See LicenseTerm for the full model. For ENUMERATED terms, Pricing MUST
  // be present. For REFERENCE_ONLY terms, License.uri is authoritative.
  // The Exchange validates ENUMERATED terms at push time and surfaces them
  // in Offer.terms on discovery.
  repeated LicenseTerm terms = 13;

  // Optional mutability hint. When omitted, the Exchange applies the `STATIC`
  // default at Offer build; an explicit `UNSPECIFIED` is rejected. A value in
  // `ext` is not read — the typed field is authoritative, so an ext-only value
  // is treated as omitted. Mirrors the required Offer-side
  // `ResourceIdentity.resource_mutability`.
  optional ResourceMutability resource_mutability = 14 [(buf.validate.field).enum = {not_in: [0]}];

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

message PushResourcesResponse {
  // Protocol version
  string ver = 1;
  // Number of entries accepted
  int32 accepted = 2;
  // Number of entries rejected
  int32 rejected = 3;

  // Non-fatal issues encountered during ingestion.
  // Examples: unrecognized vocab token in a Restriction (term accepted but flagged),
  //           REFERENCE_ONLY term missing License.uri (informational).
  // Warnings do not cause rejection — they are surfaced so publishers can fix
  // their feeds without a hard failure.
  repeated string warnings = 4;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

message RemoveResourcesRequest {
  // Protocol version
  string ver = 1;
  // Tenant identifier
  string tenant_id = 2;
  // Paths to remove
  repeated string paths = 3;
}

message RemoveResourcesResponse {
  // Protocol version
  string ver = 1;
  // Number of entries removed
  int32 removed = 2;
}

message RefreshCatalogRequest {
  // Protocol version
  string ver = 1;
  // Tenant identifier
  string tenant_id = 2;
}

message RefreshCatalogResponse {
  // Protocol version
  string ver = 1;
  // Whether the refresh was started
  bool started = 2;
}

// ============================================================================
// Post-Usage Reporting (Step 7)
// ============================================================================

// ReportingObligation — Requirements attached to a delivery.
message ReportingObligation {
  // Whether post-usage reporting is required.
  bool required = 1;

  // Duration within which the report must be submitted (e.g. "86400s" = 24
  // hours; proto-JSON encodes Duration as seconds).
  optional google.protobuf.Duration window = 2;

  // URL to submit the usage report to (if different from Exchange).
  optional string endpoint = 3;

  // Field names that must be present in the report.
  repeated string required_fields = 4;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// UsageReport — Post-usage report for a completed transaction.
//
// Filed by the agent or Broker after resource is used.
// Failure to report may result in the Exchange blocking subsequent access.
message UsageReport {
  // Protocol version
  string ver = 1;

  // Idempotency key (REQUIRED). The server MUST dedupe on this so a replayed
  // report does not double-count usage. The report's durable identity is the
  // Exchange-assigned report_id in UsageReportResponse.
  // Uniqueness is scoped to the verified RFC 9421 signer: the server dedupes per
  // (authenticated caller, key), never globally, so a key chosen by one caller
  // cannot collide with another's cached result.
  string idempotency_key = 2 [
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  // Transaction ID from the delivery.
  string transaction_id = 3;

  // Billing record identifier from the delivery (TransactionResultItem.billing_id).
  string billing_id = 4;

  // How the resource was actually used.
  Usage usage = 5;

  // When the resource was used (ISO 8601).
  google.protobuf.Timestamp timestamp = 6;

  // Exchange this report is for.
  optional string exchange = 8;

  // Assets that were delivered and used.
  repeated UsageAsset assets = 9;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// CitationFormat — How the citation is presented to the user.
enum CitationFormat {
  CITATION_FORMAT_LINK = 0;  // Hyperlink citation
  CITATION_FORMAT_FOOTNOTE = 1;  // Footnote citation
  CITATION_FORMAT_INLINE = 2;  // Inline text citation
}

// AttributionDetail — Structured attribution metadata for usage reporting.
message AttributionDetail {
  // URL displayed to the user as the attribution link.
  optional string displayed_url = 1;

  // How the citation was presented.
  optional CitationFormat format = 2;

  // Whether the attribution was visible to the end user.
  optional bool visible_to_user = 3;
}

// Usage — How resource was actually used by the AI system.
message Usage {
  // How the resource was used. Standard values: "ai-train", "ai-input",
  // "ai-index", "search", "display". Multiple allowed.
  // CoMP-specific values available via ramp-comp-v1 extension profile.
  repeated string function = 1;

  // Sub-function detail. Standard values: "training", "rag", "grounding",
  // "agent_view", "agent_actions".
  repeated string subfn = 2;

  // REQUIRED. Actual quantity consumed, in the metering unit from the Offer's Pricing.
  // For text: tokens consumed. For video: seconds watched. For data: records accessed.
  // Exchange cross-references against Offer.pricing.estimated_quantity.
  int32 consumed_quantity = 3;

  // Whether resource/output was displayed to a human.
  optional bool displayed_to_user = 4;

  // Whether citation was included as required by the offer terms.
  optional bool citation_included = 5;

  // Structured attribution details for each citation provided.
  repeated AttributionDetail attribution = 6;

  // Metering unit for consumed_quantity. Must match the Offer's Pricing.unit.
  // If omitted, defaults to "tokens". Same token format as Pricing.unit:
  // a bare registered token or a vendor:namespaced token.
  optional string consumed_unit = 8 [
    (buf.validate.field).string.max_len = 64,
    (buf.validate.field).string.pattern = "^([a-z0-9-]+|[A-Za-z0-9._-]+:[A-Za-z0-9._-]+)?$"
  ];
}

// UsageAsset — A single asset included in the usage report.
message UsageAsset {
  // Asset URI
  string uri = 1;
  // Asset title
  optional string title = 2;
  // Package identifier
  optional string package_id = 3;
}

// UsageReportResponse — Acknowledgment of a usage report.
message UsageReportResponse {
  // A successful response means the report was accepted; a rejection travels as
  // a non-OK transport error carrying ErrorDetail.usage_report_rejection.

  // Protocol version
  string ver = 1;

  // Exchange-assigned report identifier. Required for the dispute chain —
  // the agent must reference this report_id in DisputeRequest to prove that
  // a usage report was filed before disputing. The complete evidence chain:
  //   Offer → Transaction (transaction_id, billing_id)
  //        → UsageReport → UsageReportResponse (report_id)
  //        → DisputeRequest (transaction_id + report_id)
  string report_id = 3;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ============================================================================
// Broker Protocol (Steps 1, 6)
//
// These messages are for the Agent → Broker path. Step 1 is DiscoveryRequest;
// Step 6 is DiscoveryResponse, which carries offers grouped by requested URI
// (OfferGroup) — discovery only. Committing to an offer is a separate exchange
// on the execute path, which returns TransactionResponse.
// When an agent talks directly to an Exchange, it uses
// ResourceQuery/TransactionRequest directly instead.
// ============================================================================

// DiscoveryRequest — Agent sends to Broker (Step 1).
message DiscoveryRequest {
  // RAMP protocol version
  string ver = 1;

  // Requester identity — who is making this request, what scopes they have.
  // The Broker forwards this to Exchanges in ResourceQuery.requester.
  Requester requester = 3;

  // Resource URIs the agent wants. The Broker forwards these to Exchanges in
  // ResourceQuery.uris. Optional when `query` / `search_filters` drive
  // Broker-side discovery instead.
  repeated string uris = 8 [(buf.validate.field).repeated.max_items = 256];

  // The limits the agent will operate within, per restriction axis — see
  // AcceptableRestriction. The Broker forwards these to Exchanges in
  // ResourceQuery.acceptable_restrictions. Advisory selection inputs, not
  // enforcement.
  repeated AcceptableRestriction acceptable_restrictions = 9;

  // Constraints for exchange filtering and offer selection.
  optional RequestConstraints constraints = 4;

  // Domain extension profiles the agent understands.
  //
  // The Broker uses this to:
  //   1. Route queries to Exchanges that support these profiles
  //   2. Forward the profiles in ResourceQuery.supported_profiles
  //   3. Include profile-specific ext fields when returning results
  //
  // Examples: ["ramp-academic-v1"] — agent working on literature review
  repeated string supported_profiles = 5;

  // Search query for Broker-side resource discovery.
  // Used when the agent doesn't know specific URIs but wants the Broker
  // to find matching resources across Exchanges.
  // When present, the Broker interprets the query and discovers resources
  // across Exchanges on the agent's behalf. Results returned as Offers
  // in DiscoveryResponse, same as for specific URI requests.
  // Can be used alongside uris (specific URIs + search in one request).
  optional string query = 6;

  // Structured search filters (optional, alongside or instead of query).
  // Keys are profile-specific: "academic.topic", "news.category",
  // "legal.jurisdiction", etc. The Broker maps these to Exchange-specific
  // query parameters.
  optional google.protobuf.Struct search_filters = 7;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// RequestConstraints — Budget and preference constraints.
message RequestConstraints {
  // Authorized Exchange domains. Broker queries only these.
  repeated string exchanges = 1;

  // Maximum price the agent is willing to pay.
  optional Cost max_price = 2;

  // Maximum effective cost per unit, as an exact decimal string (not a float).
  optional string max_unit_cost = 3 [(buf.validate.field).string.pattern = "^([0-9]+([.][0-9]+)?)?$", (buf.validate.field).string.max_len = 32];

  // Preferred delivery methods, in order of preference.
  repeated DeliveryMethod delivery_preference = 4;

  // Whether the agent supports post-usage reporting.
  optional bool reporting_capable = 5;

  // Exchanges the agent has existing relationships with (subscriptions,
  // contracts). The Broker SHOULD prefer these when resource is
  // available — subscription resource has zero marginal cost.
  repeated string preferred_exchanges = 6;

  // Budget scope identifier for per-period tracking.
  // E.g. "user:u-12345" for per-user budgets, "team:eng" for per-team.
  // The Broker tracks cumulative spend per scope across sessions.
  optional string budget_scope = 7;

  // Per-period budget limit. The Broker tracks spend against this
  // for the budget_scope. Transactions that would exceed are denied.
  optional Cost period_budget = 8;

  // Budget period (e.g. "2592000s" = 30 days; proto-JSON encodes Duration
  // as seconds). Resets at period boundary.
  optional google.protobuf.Duration budget_period = 9;

  // Maximum acceptable age of resource data. The Broker SHOULD
  // exclude offers where (now - Offer.data_as_of) exceeds this duration.
  //
  // Only relevant for DYNAMIC resources. Ignored for STATIC (content is
  // immutable) and LIVE (content doesn't exist yet).
  //
  // Examples:
  //   7 days   — "credit report updated within the last week"
  //   1 hour   — "stock snapshot from the last hour"
  //   30 days  — "drug interaction database updated this month"
  optional google.protobuf.Duration max_data_age = 10;

  // Maximum forwarding hops the agent will allow (Agent → Broker → … →
  // Exchange), counted as the number of RFC 9421 HTTP Message Signatures on the
  // request. Caps chain depth so a request is not relayed through more brokers
  // than the agent is willing to trust or pay. A Broker MUST NOT forward a
  // request whose signature count would exceed this. Absent = agent imposes no
  // cap (the Exchange's max_intermediary_hops still applies).
  optional int32 max_hops = 11;
}

// ============================================================================
// Well-Known Discovery — two files:
//   /.well-known/ramp.json                            (RAMP commercial overlay)
//   /.well-known/http-message-signatures-directory    (pure WBA key directory)
//
// /.well-known/ramp.json is the RAMP commercial overlay, served by every RAMP
// participant. For publishers it carries authorization data (exchanges[],
// catalog_contributors[]); for exchanges, capability fields (pricing, delivery,
// auth methods). Identity keys are NOT here — every participant serves them in
// the pure WBA directory (WBAFile) at
// /.well-known/http-message-signatures-directory, referenced by RFC 7638
// thumbprint. See WellKnownManifest and WBAFile below.
//
// Caching contract:
//   /.well-known/ramp.json MAY be cached by consumers and CDNs for routine
//   periods (minutes to hours) — keys rotate slowly and carry explicit
//   not_before / not_after bounds. The WBAFile.revocation_url body, by contrast,
//   SHOULD be served with a short or zero freshness lifetime (e.g.
//   Cache-Control: max-age=60, or no-store) so the 300s consumer poll is not
//   defeated by an intermediary cache. Emergency-revocation latency is bounded
//   by the freshness of that list.
//
//   Enforcement is operational, not protocol-guaranteed: a consumer that
//   grants access against a stale revocation set bears that as its own
//   business risk — it is not a protocol deficiency.
//
// Domainless requesters — an individual agent with no public domain of its
// own — are accommodated without a protocol change: a registry (operated by
// an Exchange/Broker or a third party) hosts the agent's WellKnownManifest,
// and the agent sets Requester.domain to that registry host
// (e.g. "agent-7.registry.example"). The agent generates its own keypair; the
// registry publishes the public half at {registry}/.well-known/ramp.json. The
// domain + well-known paradigm is preserved end to end.
// ============================================================================

// Role — Identifies which kind of RAMP participant a WellKnownManifest
// describes. Verifiers fold into the role of the domain that operates
// them (typically EXCHANGE or PUBLISHER); they are not a distinct role.
enum Role {
  ROLE_UNSPECIFIED = 0;  // unset — rejected at ingest
  ROLE_AGENT = 1;
  ROLE_EXCHANGE = 2;
  ROLE_BROKER = 3;
  ROLE_PUBLISHER = 4;
}

// JsonWebKey — Inline RFC 7517 JWK object.
//
// RAMP v1.0 supports Ed25519 only: kty="OKP", crv="Ed25519", alg="EdDSA".
// Additional curves are a later concern.
//
// Time bounds are RFC3339 strings (sortable, ops-debuggable, avoids the
// JWT nbf/exp collision). At least one key in the served key set (WBAFile.keys)
// MUST have `not_before <= now < not_after`. Verification MUST reject
// signatures whose key falls outside its window.
//
// Keys carry no `kid`: the RFC 9421 keyid is the RFC 7638 JWK Thumbprint,
// computed locally by the verifier. Carrying a kid alongside the thumbprint
// created a drift surface and is removed.
message JsonWebKey {
  // Key type. RAMP v1.0: MUST be "OKP".
  string kty = 2;

  // Curve. RAMP v1.0: MUST be "Ed25519".
  string crv = 3;

  // Intended key use. RAMP v1.0: MUST be "sig".
  string use = 4;

  // Signing algorithm. RAMP v1.0: MUST be "EdDSA".
  string alg = 5;

  // base64url-encoded 32-byte Ed25519 public key.
  string x = 6;

  // RFC3339 timestamp. Key is invalid before this instant.
  string not_before = 7;

  // RFC3339 timestamp. Key is invalid at and after this instant
  // (strict upper bound).
  string not_after = 8;
}

// WellKnownManifest — RAMP commercial overlay, served at /.well-known/ramp.json
// by every RAMP participant (agent, exchange, broker, publisher).
//
// Commercial graph only: role, authorized exchanges/contributors, and exchange
// capability fields. Identity keys are NOT here — they live in the WBA directory
// (WBAFile) served at /.well-known/http-message-signatures-directory and are
// referenced by RFC 7638 thumbprint, never republished here.
// Per-role fields are populated only when that role applies; consumers
// MUST ignore non-applicable fields based on `role`.
message WellKnownManifest {
  // RAMP protocol version. MUST equal "1.0"; consumers REJECT
  // unrecognised major versions.
  string ver = 1;

  // Role this manifest describes.
  Role role = 2 [(buf.validate.field).enum = {not_in: [0]}];


  // Canonical domain serving this manifest.
  string domain = 3;

  // Contact email (licensing, integration, security).
  optional string contact = 4;

  // Publisher-only. Authorized exchanges for this publisher's resources.
  // Like ads.txt — declares who may sell. MUST be empty for non-publisher
  // roles.
  repeated AuthorizedExchange exchanges = 7;

  // Publisher-only. Authorized third-party catalog contributors.
  // MUST be empty for non-publisher roles.
  repeated CatalogContributor catalog_contributors = 8;

  // Exchange-only. Human-readable Exchange name.
  optional string name = 9;

  // Exchange-only. Organization operating this Exchange.
  optional string operator = 10;

  // Exchange-only. Operator's corporate domain (may differ from domain).
  optional string operator_domain = 11;

  // Exchange-only. ExchangeService endpoint URL.
  optional string endpoint = 12;

  // Exchange-only. Health check endpoint URL.
  optional string health_endpoint = 13;

  // Exchange-only. CatalogService endpoint URL (if exposed).
  optional string catalog_endpoint = 14;

  // ext is conventional field 15 in this proto; see below.

  // Exchange-only. Supported RAMP protocol versions (e.g. ["1.0"]).
  repeated string protocol_versions_supported = 16;

  // Exchange-only. Supported pricing models.
  repeated PricingModel pricing_models_supported = 17;

  // Exchange-only. Supported delivery methods.
  repeated DeliveryMethod delivery_methods_supported = 18;

  // Exchange-only. Accepted resource hash methods for attestation
  // verification.
  repeated string hash_methods_supported = 19;

  // Exchange-only. Trusted attestation verification vendors (domains).
  repeated string accepted_verifiers = 20;

  // Exchange-only. Terms of service URL.
  optional string terms_uri = 21;

  // Exchange-only. Privacy policy URL.
  optional string privacy_uri = 22;

  // Exchange-only. Domain extension profiles this Exchange conforms to.
  // See standards-layering docs.
  repeated string supported_profiles = 23;

  // Exchange-only. Authorization methods this Exchange supports
  // (ordered by preference).
  repeated AuthMethod supported_auth_methods = 24;

  // Exchange-only. OIDC Discovery URL when OAuth methods are supported.
  optional string oidc_issuer = 25;

  // Exchange-only. GNAP grant endpoint when GNAP is supported.
  optional string gnap_grant_endpoint = 26;

  // Exchange-only. Base currency for pricing (ISO 4217). All unit_cost
  // values from this Exchange are denominated in this currency.
  optional string base_currency = 27;

  // Exchange-only. Maximum forwarding hops this Exchange tolerates on an inbound
  // request (Agent → Broker → … → Exchange), counted as RFC 9421 HTTP Message
  // Signatures. A request carrying more SHOULD be rejected. Lets Exchanges
  // publish their chain-depth tolerance so Brokers prune before forwarding.
  // Absent = no published limit (Exchange applies its own default policy).
  optional int32 max_intermediary_hops = 28;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052). Lists keys
  // within ext that the consumer MUST understand. Unknown values reject
  // with UNKNOWN_CRITICAL_EXTENSION. Empty (default) → ignore-unknown.
  repeated string ext_critical = 90;
}

// WBAFile — Pure Web Bot Auth directory served at the WBA-canonical well-known
// path (/.well-known/http-message-signatures-directory). A JOSE JWK Set per
// RFC 7517 §5 plus a directory-level revocation pointer. JWKs carry no kid; the
// RFC 9421 keyid is the RFC 7638 JWK Thumbprint. Off-the-shelf WBA verifiers
// read the `keys` array and ignore RAMP's extra members (per-key
// not_before/not_after, and revocation_url) per RFC 7517 §5.
message WBAFile {
  // RFC 7517 JWK Set "keys" member. RAMP v1: Ed25519 (OKP) keys, each with
  // not_before/not_after RAMP extension members.
  repeated JsonWebKey keys = 1;

  // Directory-level emergency revocation channel. One per directory; the list
  // it points to enumerates revoked key thumbprints. Consumers poll on a 300s
  // cadence (±10% jitter) and replace their local revoked set with the response.
  optional string revocation_url = 2;
}

// KeyRevocationList — Body served at WBAFile.revocation_url.
//
// Snapshot semantics: `revoked` is the complete list of revoked key thumbprints
// (RFC 7638, base64url-no-pad) at `as_of`. Consumers replace their local
// revocation set on each successful poll (no diff protocol). A revoked
// thumbprint stays revoked permanently; once dropped from the list, consumers
// MAY drop it from their local set but the corresponding key SHOULD NOT be
// re-introduced into WBAFile.keys.
message KeyRevocationList {
  // Server's response time (RFC3339, UTC). Consumers use this to detect
  // clock skew.
  google.protobuf.Timestamp as_of = 1;

  // Complete list of revoked key thumbprints (RFC 7638, base64url-no-pad) at
  // `as_of`.
  repeated string revoked = 2;
}

// CatalogContributor — A third party authorized to push catalog metadata
// (including attestations) on behalf of a provider.
message CatalogContributor {
  // Canonical domain of the authorized contributor (e.g., "doubleverify.com").
  string domain = 1;

  // Relationship of this contributor to the provider.
  // Examples: "verifier" (resource intelligence vendor that attests to resource
  // properties), "exchange" (an Exchange that enriches catalog entries).
  string relationship = 2;
}

// AuthorizedExchange — A Exchange authorized to sell this provider's resources.
message AuthorizedExchange {
  // Canonical domain of the Exchange.
  string domain = 1;

  // RAMP ExchangeService endpoint URL.
  string endpoint = 2;

  // Relationship type (mirrors ads.txt DIRECT/RESELLER).
  ProviderRelationship relationship = 3 [(buf.validate.field).enum = {not_in: [0]}];


  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

enum ProviderRelationship {
  PROVIDER_RELATIONSHIP_UNSPECIFIED = 0;  // unset — rejected at ingest
  // Provider has a direct contract with this Exchange.
  PROVIDER_RELATIONSHIP_DIRECT = 1;
  // Exchange resells resources via another authorized party.
  PROVIDER_RELATIONSHIP_RESELLER = 2;
}

// AuthMethod — Authorization methods an Exchange can support.
// Advertised in WellKnownManifest.supported_auth_methods (ordered by preference).
enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;  // unset — zero allowed on WellKnownManifest.supported_auth_methods (capability list); no discriminator carrier
  // GNAP (RFC 9635) — key-first identity, key-bound tokens. Recommended.
  AUTH_METHOD_GNAP = 1;
  // OAuth 2.0 + DPoP (RFC 9449) — sender-constrained tokens. Enterprise recommended.
  AUTH_METHOD_OAUTH_DPOP = 2;
  // OAuth 2.0 Bearer JWT — acceptable, widely deployed.
  AUTH_METHOD_OAUTH_BEARER = 3;
  // OAuth 2.0 + mTLS — high-security environments.
  AUTH_METHOD_OAUTH_MTLS = 4;
}

// DiscoveryResponse — Broker returns to Agent (Step 6).
//
// Carries discovery results only: the offers the Broker gathered across
// Exchanges, grouped by the URI they were requested for. Committing to an offer
// is a separate exchange on the execute path; that per-transaction result
// (transaction_id, billing_id, cost, delivery_method, retrieval endpoint, …)
// is returned by TransactionResponse, not here.
message DiscoveryResponse {
  string ver = 1;

  // Offers grouped by requested URI — the sole offer representation in this
  // response. One OfferGroup per URI the agent asked for (echoed in
  // OfferGroup.uri); a group with no offers carries OfferGroup.absence_reason
  // explaining why. Each contained Offer is the full signed Offer the Exchange
  // issued (including Offer.exchange, the execute-routing target), forwarded by
  // the Broker unchanged so the agent can verify the signature end to end.
  repeated OfferGroup offer_groups = 4;

  // Why the resolve produced no offers at all. Set (and offer_groups empty) on a
  // successful "no result" answer; unset when offer_groups is non-empty. Same
  // vocabulary DiscoverResources uses for OfferGroup.absence_reason.
  // RESTRICTION_FILTERED may appear here, but Resolve does not surface the
  // per-axis detail: DiscoveryResponse has no restriction_filters companion
  // (unlike OfferGroup). A consumer needing the filtered axes calls
  // DiscoverResources.
  //
  // Existence-oracle note: an authorization-flavored reason (SCOPE_INSUFFICIENT,
  // NOT_AUTHORIZED, NOT_IN_CATALOG, CONTENT_BLOCKED) confirms a resource exists
  // and why access was refused. Resolve surfaces the same oracle at the broker
  // that OfferGroup.absence_reason does at the Exchange, so the same mitigation
  // applies: where existence itself must stay hidden, the Broker MAY omit the
  // reason (leave this unset) rather than reveal it. See the threat model.
  optional OfferAbsenceReason absence_reason = 16;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ============================================================================
// Resource Disputes
//
// Full dispute lifecycle with three-tier resolution:
//   Tier 1: Automated (<1s) — auto-credit on CDN delivery failure, hash mismatch
//   Tier 2: Rule-based review (<24h) — concrete resolution rules
//   Tier 3: Pattern investigation (async) — aggregate fraud detection
//
// Dispute chain: agent MUST file UsageReport before filing a dispute.
//   Offer → Transaction (transaction_id, billing_id)
//        → UsageReport → UsageReportResponse (report_id)
//        → DisputeRequest (transaction_id + report_id) → DisputeResponse
// ============================================================================

// DisputeRequest — Agent signals a problem with delivered resource.
message DisputeRequest {
  // Protocol version
  string ver = 1;

  // Idempotency key (REQUIRED). The server MUST dedupe on this so a replayed
  // filing does not open a duplicate case. The dispute's durable identity is the
  // Exchange-assigned dispute_id in DisputeResponse.
  // Uniqueness is scoped to the verified RFC 9421 signer: the server dedupes per
  // (authenticated caller, key), never globally, so a key chosen by one caller
  // cannot collide with another's cached result.
  string idempotency_key = 2 [
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];

  // Transaction being disputed.
  string transaction_id = 3;

  // Billing record identifier from the disputed transaction
  // (TransactionResultItem.billing_id).
  string billing_id = 4;

  // Reason for the dispute.
  DisputeReason reason = 5 [(buf.validate.field).enum = {not_in: [0]}];

  // Human-readable description of the issue.
  optional string description = 6;

  // Evidence: content hash of what was actually received.
  // Exchange compares against the hash promised in ResourceIdentity.
  optional string received_content_hash = 7;
  // Hash algorithm the agent used
  optional string received_hash_method = 8;

  // Must reference a filed UsageReport. The agent MUST file a UsageReport
  // (via ReportUsage RPC) and receive a report_id BEFORE filing a dispute.
  // This prevents fire-and-forget disputes and ensures the Exchange has
  // the complete evidence chain: what was offered, what was transacted,
  // what the agent reported using, and what the agent disputes.
  // The dispute chain: Transaction → UsageReport → Dispute.
  string report_id = 9;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;

}

enum DisputeReason {
  DISPUTE_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  // Content hash does not match what was promised in the Offer.
  DISPUTE_REASON_CONTENT_MISMATCH = 1;
  // Resource was not delivered (signed URL returned 404/403/5xx).
  DISPUTE_REASON_DELIVERY_FAILED = 2;
  // Resource was delivered but is entirely different from what was described.
  DISPUTE_REASON_WRONG_CONTENT = 3;
  // Signed URL expired before the agent could fetch the resource.
  DISPUTE_REASON_EXPIRED_BEFORE_FETCH = 4;
  // Resource was truncated or incomplete.
  DISPUTE_REASON_INCOMPLETE_CONTENT = 5;
}

// DisputeStatus — Lifecycle state of a resource dispute.
//
// Disputes progress through a three-tier resolution process:
//   Tier 1 (automated, <1 second, ~99% of cases): Auto-credit when evidence
//     is independently verifiable (CDN logs, cryptographic hash comparison).
//     FILED → AUTO_RESOLVED.
//   Tier 2 (rule-based review, <24 hours, ~0.9%): Exchange applies concrete
//     resolution rules when Tier 1 evidence is inconclusive.
//     FILED → EVIDENCE_NEEDED → UNDER_REVIEW → RESOLVED.
//   Tier 3 (pattern investigation, async, ~0.1%): Triggered by aggregate
//     patterns (e.g., agent dispute rate >5%, provider token discrepancy >2%).
//     ESCALATED → SETTLED → FINAL.
//
// Appeals: losing party may appeal with new evidence.
//   RESOLVED → APPEALED → UNDER_REVIEW (re-enters Tier 2).
enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;  // unset — output/optional; zero is a valid not-applicable/unset state
  // Agent submitted DisputeRequest. Initial state.
  DISPUTE_STATUS_FILED = 1;
  // Exchange auto-resolved via Tier 1 rules (CDN logs, hash comparison).
  DISPUTE_STATUS_AUTO_RESOLVED = 2;
  // Exchange requests additional evidence from the agent or provider.
  DISPUTE_STATUS_EVIDENCE_NEEDED = 3;
  // Exchange is reviewing with Tier 2 resolution rules.
  DISPUTE_STATUS_UNDER_REVIEW = 4;
  // Escalated to Tier 3 pattern-based investigation.
  DISPUTE_STATUS_ESCALATED = 5;
  // Decision made (credit, redelivery, rejected). See resolution field.
  DISPUTE_STATUS_RESOLVED = 6;
  // Losing party appealed with new evidence. Re-enters review.
  DISPUTE_STATUS_APPEALED = 7;
  // Financial settlement applied.
  DISPUTE_STATUS_SETTLED = 8;
  // No further appeals. Dispute closed.
  DISPUTE_STATUS_FINAL = 9;
}

// ResolutionType — Outcome of a resolved dispute.
//
// Populated in DisputeResponse.resolution when the dispute reaches a
// terminal state (RESOLVED, SETTLED, or FINAL).
enum ResolutionType {
  RESOLUTION_TYPE_UNSPECIFIED = 0;  // unset — output/optional; zero is a valid not-applicable/unset state
  // Account credit applied to the agent's next billing cycle.
  RESOLUTION_TYPE_CREDIT = 1;
  // New signed URL issued for the same resource (e.g., when content hash
  // now matches after provider correction).
  RESOLUTION_TYPE_REDELIVERY = 2;
  // Dispute reviewed and rejected; no remedy applied.
  RESOLUTION_TYPE_REJECTED = 3;
  // Escalated to Tier 3 pattern analysis for further investigation.
  RESOLUTION_TYPE_INVESTIGATION = 4;
}

// DisputeResponse — Exchange acknowledges the dispute.
message DisputeResponse {
  // A successful response means the dispute was accepted for processing; a
  // refusal to file travels as a non-OK transport error carrying
  // ErrorDetail.dispute_failure.

  // Protocol version
  string ver = 1;

  // Exchange-assigned dispute case identifier.
  optional string dispute_id = 2;

  // Expected resolution timeline.
  optional google.protobuf.Duration estimated_resolution = 4;

  // Current lifecycle status of the dispute. Tracks progression through
  // the three-tier resolution process:
  //   Tier 1 (automated, <1s): FILED → AUTO_RESOLVED or EVIDENCE_NEEDED
  //   Tier 2 (rule-based, <24h): UNDER_REVIEW → RESOLVED
  //   Tier 3 (pattern investigation, async): ESCALATED → SETTLED → FINAL
  // Losing party may appeal: RESOLVED → APPEALED → back to UNDER_REVIEW.
  DisputeStatus status = 5;

  // Resolution outcome, populated when the dispute reaches a terminal
  // state (RESOLVED, SETTLED, or FINAL). Absent while dispute is in
  // progress (FILED, UNDER_REVIEW, ESCALATED, etc.).
  optional ResolutionType resolution = 6;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ============================================================================
// Provider Domain Verification
//
// ACME HTTP-01 style domain verification for provider onboarding.
// Proves that the caller controls the provider domain before accepting
// signing keys or configuration changes. Used by ramp-cli.
//
// Flow:
//   1. Provider calls RequestDomainVerification with their domain
//   2. Exchange returns a challenge token
//   3. Provider places the token at {domain}/.well-known/ramp-verify/{token}
//      (edge function can auto-serve this from KV store)
//   4. Provider calls ConfirmDomainVerification
//   5. Exchange fetches the challenge URL to verify domain control
//   6. If verified: Exchange accepts subsequent operations for this domain
//
// Double protection: Exchange also checks ramp.json to verify it is
// listed as an authorized exchange for this provider.
// ============================================================================

// DomainVerificationRequest — Provider requests a verification challenge.
message DomainVerificationRequest {
  // Protocol version
  string ver = 1;

  // The provider domain to verify (e.g., "techcrunch.com").
  string domain = 2;

  // Caller identity (registered with the Exchange).
  optional string caller_id = 3;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// DomainVerificationChallenge — Exchange returns a challenge.
message DomainVerificationChallenge {
  // Protocol version
  string ver = 1;

  // Opaque challenge token. Provider must serve this at:
  // https://{domain}/.well-known/ramp-verify/{token}
  string token = 2;

  // When this challenge expires. Provider must confirm before this time.
  google.protobuf.Timestamp expires_at = 3;

  // The exact URL the Exchange will fetch to verify.
  string verification_url = 4;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// DomainVerificationConfirmation — Provider confirms the challenge is placed.
message DomainVerificationConfirmation {
  // Protocol version
  string ver = 1;

  // The domain being verified.
  string domain = 2;

  // The challenge token (echoed from DomainVerificationChallenge).
  string token = 3;

  // Optional: signing key to register upon successful verification.
  // If present, the key is registered atomically with verification.
  // Key format depends on CDN type (PEM for CloudFront, hex for HMAC).
  optional string signing_key = 4;

  // CDN type this key is for.
  optional string cdn_type = 5;  // "cloudfront", "akamai", "fastly", "hmac"

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// DomainVerificationResult — Exchange confirms verification.
message DomainVerificationResult {
  // A successful response means verification succeeded; a failure travels as a
  // non-OK transport error carrying ErrorDetail.domain_verification_failure.

  // Protocol version
  string ver = 1;

  // If signing_key was provided: confirmation of key registration.
  optional string key_id = 2;

  // Verification is valid until this time. Provider must re-verify periodically.
  optional google.protobuf.Timestamp valid_until = 4;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ============================================================================
// Agent Account Registration
//
// An agent becomes KNOWN to an Exchange just by sending a signed request.
// To transact for paid content it must REGISTER: the Exchange creates the
// agent's account and mints billing_ref — the opaque, long-lived,
// per-Exchange account handle. The agent never has to carry billing_ref
// afterwards; the Exchange resolves the account from the verified request
// signature on every call, never from anything the caller sends.
//
// The Exchange does not inspect or validate the business payload
// (registration_data): its contents are operator-defined and enforced by the
// registration front-end, not by this contract.
// ============================================================================

// RegisterRequest — Agent asks the Exchange to create its account.
message RegisterRequest {
  // Protocol version
  string ver = 1;

  // Operator-defined registration payload; the business fields are not fixed
  // in the wire contract. The Exchange passes it through to its system of
  // record without inspecting it. The caller's identity is taken from the
  // verified request signature, never from this payload.
  google.protobuf.Struct registration_data = 2;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// RegisterResponse — Exchange returns the minted account handle.
message RegisterResponse {
  // A successful response means the account exists; a refused registration
  // travels as a non-OK transport error carrying ErrorDetail.registration_failure.

  // Protocol version
  string ver = 1;

  // Opaque, long-lived, per-Exchange account handle minted by the Exchange.
  // Means nothing on its own and is never accepted as caller input. A repeat
  // Register for the same agent returns the same value.
  string billing_ref = 2;

  // Whether the account is currently active. Accounts may start inactive
  // and be activated out-of-band by the Exchange operator.
  bool active = 3;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// GetAccountStatusRequest — Agent asks whether its account is active.
message GetAccountStatusRequest {
  // Deliberately carries no identifying field: the Exchange resolves the
  // account from the verified request signature.

  // Protocol version
  string ver = 1;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// GetAccountStatusResponse — Exchange reports the account's current state.
message GetAccountStatusResponse {
  // Protocol version
  string ver = 1;

  // The account handle minted at registration (see RegisterResponse.billing_ref).
  // Empty when the calling agent has no account yet.
  string billing_ref = 2;

  // Whether the account is currently active.
  bool active = 3;

  // Extension point
  google.protobuf.Struct ext = 15;

  // Critical extension keys (COSE crit pattern, RFC 9052).
  // Lists keys within ext that the consumer MUST understand.
  // Unknown keys in this list → reject with UNKNOWN_CRITICAL_EXTENSION.
  // Empty (default) → all ext keys are safe to ignore.
  repeated string ext_critical = 90;
}

// ============================================================================
// Unified Error Model
//
// One way to communicate failure across every RPC. The transport carries a
// coarse canonical code (gRPC / Connect Code) as the error CLASS; an ErrorDetail
// message — attached to the transport error's details, the same mechanism
// protovalidate uses to attach its Violations — carries the precise,
// machine-readable reason and structured context. Clients branch on the typed
// reason, never on a human string.
//
// Error vs. body: a QUERY that ran successfully returns its answer in the
// response body, and "no results" / per-item absence (OfferGroup.absence_reason)
// is a success — NOT an error. Only a method that could not perform the
// requested ACTION returns a non-OK code plus an ErrorDetail.
//
// Failure-type naming is intentionally NOT uniform — the suffix marks the KIND
// of failure: *Denial is an access decision (a transaction was denied),
// *Rejection is a submission refused (catalog push, usage report), and *Failure
// is an operation that could not complete (registration, dispute, domain
// verification, retrieval auth). The distinction is deliberate; do not flatten
// these to a single suffix.
//
// The per-domain reason enums here are the single source of truth that replaces
// the hand-rolled Go "Kind" enums (Exchange, Broker), the catalog free-text
// strings, and the edge TypeScript token unions. Services map a domain failure
// to a transport code only; the reason they emit comes from these enums.
// ============================================================================

// ErrorDetail — the structured detail attached to every non-OK transport error.
message ErrorDetail {
  // Developer-facing, NON-authoritative human message. Clients MUST branch on
  // the typed reason below, never on this text. Servers SHOULD NOT place secrets,
  // PII, or existence/authorization detail here that the closed typed reason
  // deliberately withholds: unlike the enum, this free text is unbounded and
  // easily becomes an existence oracle or leak channel (see `metadata`).
  string message = 1;

  // Stable grouping for the failing surface, e.g. "ramp.v1.ExchangeService".
  // Mirrors google.rpc.ErrorInfo.domain so generic tooling can group errors.
  string domain = 2;

  // Dynamic key/value context that also appears in `message` (ids, limits,
  // axes). Mirrors google.rpc.ErrorInfo.metadata. Strongly-typed context rides
  // in the per-domain reason block below instead. Same leakage rule as `message`:
  // servers SHOULD NOT put secrets, PII, or withheld existence/authorization
  // detail here — it is the same potential side channel as the absence oracle.
  map<string, string> metadata = 3;

  // Exactly one typed reason block, selected by the failing method. Absent for
  // generic transport-class failures (e.g. INVALID_ARGUMENT, INTERNAL) that
  // carry no domain-specific reason.
  oneof reason {
    // `reason` oneof — ExecuteTransaction denial
    TransactionDenial transaction_denial = 10;
    // `reason` oneof — CatalogService rejection
    CatalogRejection catalog_rejection = 11;
    // `reason` oneof — agent/provider registration refused
    RegistrationFailure registration_failure = 12;
    // `reason` oneof — DisputeTransaction filing refused
    DisputeFailure dispute_failure = 13;
    // `reason` oneof — domain verification failed
    DomainVerificationFailure domain_verification_failure = 14;
    // `reason` oneof — signed-URL / proof-of-possession check failed
    RetrievalAuthFailure retrieval_auth_failure = 15;
    // `reason` oneof — ReportUsage filing rejected
    UsageReportRejection usage_report_rejection = 16;
  }
}

// TransactionDenial — ExecuteTransaction could not complete. Carries the denial
// reason the response body no longer holds (denial_reason / restriction_mismatches
// move here in the response-shape normalization). Reuses the DenialReason vocab.
message TransactionDenial {
  // The denial reason (defined-only, non-zero)
  DenialReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];

  // When reason = RESTRICTION_NOT_SATISFIED, the failed axes (same
  // RestrictionKind vocabulary the terms use).
  repeated RestrictionKind restriction_mismatches = 2;

  // Batch mode: the offer this denial pertains to.
  optional string offer_id = 3;
}

// CatalogRejectionReason — why a CatalogService call was rejected. Replaces the
// hand-rolled catalog reason strings ("caller not in catalog contributors",
// "tenant mismatch", "signature middleware missing").
enum CatalogRejectionReason {
  CATALOG_REJECTION_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  CATALOG_REJECTION_REASON_NOT_CATALOG_CONTRIBUTOR = 1; // caller is not an authorized contributor for the domain
  CATALOG_REJECTION_REASON_TENANT_MISMATCH = 2;         // tenant_id does not match the authenticated caller
  CATALOG_REJECTION_REASON_DOMAIN_NOT_VERIFIED = 3;     // contributing domain is not verified
  CATALOG_REJECTION_REASON_SIGNATURE_INVALID = 4;       // request signature missing or invalid
  CATALOG_REJECTION_REASON_MALFORMED_ENTRY = 5;         // a resource entry failed schema/validation
  CATALOG_REJECTION_REASON_UNKNOWN_VOCAB_TOKEN = 6;     // an unregistered vocab token in a restriction/term
  CATALOG_REJECTION_REASON_QUOTA_EXCEEDED = 7;          // contributor push quota exceeded (per-caller)
  CATALOG_REJECTION_REASON_TERMS_LIMIT_EXCEEDED = 8;    // a single entry carries more license terms than allowed (per-entry cap)
  // The URI cannot be claimed by this caller's entries. Named from the caller's
  // own perspective ON PURPOSE: it MUST NOT disclose that another resource/
  // contributor already owns the URI. Within one publisher, mutually-untrusting
  // contributors share a catalog, so an "owned by another" reason would be a
  // confirmed-existence oracle a contributor could use to map a competitor's
  // catalog. The conflict is resolvable only by the publisher (who is authorized
  // to see full ownership); the human-readable message routes the caller there
  // without confirming who, if anyone, holds the URI.
  CATALOG_REJECTION_REASON_URI_UNAVAILABLE = 9;
}

// CatalogRejection — a CatalogService call could not be applied.
message CatalogRejection {
  // The rejection reason (defined-only, non-zero)
  CatalogRejectionReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];

  // For partial-batch failures: the entry paths that were rejected.
  repeated string rejected_paths = 2;
}

// RegistrationFailureReason — why agent/provider registration was refused.
// Replaces the hand-rolled errors on POST /exchange/v1/agents/register.
enum RegistrationFailureReason {
  REGISTRATION_FAILURE_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  REGISTRATION_FAILURE_REASON_DOMAIN_NOT_VERIFIED = 1; // caller domain is not verified
  REGISTRATION_FAILURE_REASON_INVALID_KEY = 2;         // signing key malformed or unsupported
  REGISTRATION_FAILURE_REASON_SIGNATURE_INVALID = 3;   // request signature invalid
  REGISTRATION_FAILURE_REASON_ALREADY_REGISTERED = 4;  // identity already registered
  REGISTRATION_FAILURE_REASON_QUOTA_EXCEEDED = 5;      // registration quota exceeded
}

// RegistrationFailure — a registration request could not be completed.
message RegistrationFailure {
  // The failure reason (defined-only, non-zero)
  RegistrationFailureReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// DisputeFailureReason — why a DisputeTransaction filing was refused. Distinct
// from DisputeReason (why the agent disputes) and DisputeStatus (an accepted
// dispute's lifecycle).
enum DisputeFailureReason {
  DISPUTE_FAILURE_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  DISPUTE_FAILURE_REASON_TRANSACTION_NOT_FOUND = 1; // transaction_id is unknown
  DISPUTE_FAILURE_REASON_REPORT_NOT_FILED = 2;      // no UsageReport precedes the dispute (report_id missing/unknown)
  DISPUTE_FAILURE_REASON_WINDOW_EXPIRED = 3;        // filed outside the allowed dispute window
  DISPUTE_FAILURE_REASON_DUPLICATE = 4;             // a dispute already exists for this transaction
  DISPUTE_FAILURE_REASON_INELIGIBLE = 5;            // the transaction/state is not disputable
}

// DisputeFailure — a dispute could not be filed.
message DisputeFailure {
  // The failure reason (defined-only, non-zero)
  DisputeFailureReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// DomainVerificationFailureReason — why provider domain verification failed.
enum DomainVerificationFailureReason {
  DOMAIN_VERIFICATION_FAILURE_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  DOMAIN_VERIFICATION_FAILURE_REASON_CHALLENGE_NOT_FOUND = 1;     // token not served at the well-known path
  DOMAIN_VERIFICATION_FAILURE_REASON_CHALLENGE_MISMATCH = 2;      // served token does not match the issued token
  DOMAIN_VERIFICATION_FAILURE_REASON_CHALLENGE_EXPIRED = 3;       // confirmation arrived after the challenge expired
  DOMAIN_VERIFICATION_FAILURE_REASON_FETCH_FAILED = 4;           // Exchange could not fetch the verification URL
  DOMAIN_VERIFICATION_FAILURE_REASON_EXCHANGE_NOT_AUTHORIZED = 5; // ramp.json does not list this Exchange
  DOMAIN_VERIFICATION_FAILURE_REASON_KEY_REGISTRATION_FAILED = 6; // signing-key registration failed during confirmation
}

// DomainVerificationFailure — RequestDomainVerification / ConfirmDomainVerification failed.
message DomainVerificationFailure {
  // The failure reason (defined-only, non-zero)
  DomainVerificationFailureReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// RetrievalAuthFailureReason — why a signed-URL retrieval or its proof-of-
// possession was rejected at the delivery edge. Single-sources the edge
// TypeScript token unions in verify.ts (signed-URL) and pop.ts (RFC 9421 PoP).
enum RetrievalAuthFailureReason {
  RETRIEVAL_AUTH_FAILURE_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  // Signed-URL checks (verify.ts).
  RETRIEVAL_AUTH_FAILURE_REASON_URL_EXPIRED = 1;             // 'expired'
  RETRIEVAL_AUTH_FAILURE_REASON_URL_SIGNATURE_MISSING = 2;   // 'missing_sig'
  RETRIEVAL_AUTH_FAILURE_REASON_URL_EXPIRY_MISSING = 3;      // 'missing_exp'
  RETRIEVAL_AUTH_FAILURE_REASON_URL_SIGNATURE_MISMATCH = 4;  // 'signature_mismatch'
  // Proof-of-possession checks (pop.ts).
  RETRIEVAL_AUTH_FAILURE_REASON_AGENT_KEY_MISSING = 5;       // 'missing_agent_key'
  RETRIEVAL_AUTH_FAILURE_REASON_PROOF_SIGNATURE_MISSING = 6; // 'missing_sig'
  RETRIEVAL_AUTH_FAILURE_REASON_KEYID_MISMATCH = 7;          // 'keyid_mismatch'
  RETRIEVAL_AUTH_FAILURE_REASON_THUMBPRINT_MISMATCH = 8;     // 'thumbprint_mismatch'
  RETRIEVAL_AUTH_FAILURE_REASON_PROOF_CREATED_MISSING = 9;   // 'pop_missing_created'
  RETRIEVAL_AUTH_FAILURE_REASON_PROOF_EXPIRY_MISSING = 10;   // 'pop_missing_exp'
  RETRIEVAL_AUTH_FAILURE_REASON_PROOF_EXPIRED = 11;          // 'pop_expired'
  RETRIEVAL_AUTH_FAILURE_REASON_PROOF_SIGNATURE_INVALID = 12; // 'pop_sig_invalid'
}

// RetrievalAuthFailure — a signed-URL retrieval / proof-of-possession check failed.
message RetrievalAuthFailure {
  // The failure reason (defined-only, non-zero)
  RetrievalAuthFailureReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}

// UsageReportRejectionReason — why a ReportUsage filing was rejected. Replaces
// the free-text UsageReportResponse.rejection_reason string.
enum UsageReportRejectionReason {
  USAGE_REPORT_REJECTION_REASON_UNSPECIFIED = 0;  // unset — rejected at ingest
  USAGE_REPORT_REJECTION_REASON_TRANSACTION_NOT_FOUND = 1;     // transaction_id is unknown
  USAGE_REPORT_REJECTION_REASON_DUPLICATE = 2;                 // a report was already filed for this transaction
  USAGE_REPORT_REJECTION_REASON_WINDOW_EXPIRED = 3;            // filed outside the reporting window
  USAGE_REPORT_REJECTION_REASON_MISSING_REQUIRED_FIELDS = 4;   // ReportingObligation.required_fields not satisfied
  USAGE_REPORT_REJECTION_REASON_MALFORMED = 5;                 // report payload failed validation
}

// UsageReportRejection — a usage report could not be accepted.
message UsageReportRejection {
  // The rejection reason (defined-only, non-zero)
  UsageReportRejectionReason reason = 1 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]}
  ];
}
