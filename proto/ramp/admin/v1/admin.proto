// RAMP Admin v1 — operator-plane configuration service.
//
// AdminService carries Exchange operator overrides: the tenant fee rate and
// the tenant reporting policy. It is deliberately a separate package and
// service from ramp.v1.ExchangeService — the operator/config plane is not
// part of the agent hot-path contract, and keeping it out of ramp.v1 keeps
// the agent-facing surface unchanged.
//
// Trust model: deployments MUST NOT expose AdminService on the public
// agent-facing listener. Reachability is restricted at the network layer
// (an internal listener plus a source allowlist); there is no per-operator
// identity inside the service in v1. Because the admin plane carries no
// RFC 9421 request signing, there is no verified signer to deduplicate
// against — and both RPCs are full-replace overwrites, so they are naturally
// idempotent and carry no idempotency_key.
//
// Responses echo the state as persisted, giving operator tooling a read-back
// confirmation of the applied values.
//
// Validation: every constraint here is a FIELD-level protovalidate rule so it
// flows into the generated Pydantic/Zod types. Cross-field (message-level CEL)
// rules are intentionally absent from this package.

syntax = "proto3";

package ramp.admin.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/RAMP-Protocol/protocol/gen/go/ramp/admin/v1;rampadminv1";

// Operator-plane configuration RPCs. See the file banner for the trust model
// and why these setters carry no idempotency_key.
service AdminService {
  // Sets the tenant's fee rate (basis points) and optional operator note.
  // Full replace: the previous rate and note are overwritten.
  rpc SetTenantFeeRate(SetTenantFeeRateRequest) returns (SetTenantFeeRateResponse);
  // Replaces the tenant's reporting policy (required report fields, quantity
  // tolerance, reporting window). Full replace: omitted optional fields clear
  // their key so the consumer's defaults apply.
  rpc SetReportingPolicy(SetReportingPolicyRequest) returns (SetReportingPolicyResponse);
}

message SetTenantFeeRateRequest {
  // RAMP protocol version.
  string ver = 1;

  // The tenant whose fee rate is being set.
  string tenant_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // Fee rate in basis points. Mirrors the consumer-side storage constraint:
  // 0 <= fee_rate_bps < 10000 (a fee below 100%). 0 is a legitimate explicit
  // value ("no fee"), not an unset sentinel.
  int32 fee_rate_bps = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lt = 10000
  ];

  // Operator commentary on the rate (why it was set, by whom, ticket link).
  // Omitted clears any existing note.
  optional string notes = 4 [(buf.validate.field).string.max_len = 1024];
}

message SetTenantFeeRateResponse {
  // RAMP protocol version.
  string ver = 1;

  // The tenant the rate was applied to.
  string tenant_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // The fee rate as persisted.
  int32 fee_rate_bps = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lt = 10000
  ];

  // The note as persisted; absent when the note is cleared.
  optional string notes = 4 [(buf.validate.field).string.max_len = 1024];
}

message SetReportingPolicyRequest {
  // RAMP protocol version.
  string ver = 1;

  // The tenant whose reporting policy is being replaced.
  string tenant_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // Report fields the usage-report validator requires. Which field names are
  // meaningful is enforced by the consumer service-side (the known set may
  // evolve without a contract change); the wire constrains only the token
  // shape. Empty means no required fields.
  repeated string required_fields = 3 [
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9._:*-]+$"
  ];

  // Accepted relative deviation between estimated and reported quantity,
  // as a fraction (0 = exact match required, 1 = any deviation accepted).
  // Omitted: the consumer's default tolerance applies.
  optional double quantity_tolerance = 4 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 1
  ];

  // Reporting window in seconds for obligations minted after this change
  // (the policy is snapshotted onto each obligation when the transaction
  // executes). Capped at one year. Omitted: the consumer's default applies.
  optional int32 window_seconds = 5 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 31536000
  ];
}

message SetReportingPolicyResponse {
  // RAMP protocol version.
  string ver = 1;

  // The tenant the policy was applied to.
  string tenant_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // The required report fields as persisted.
  repeated string required_fields = 3 [
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9._:*-]+$"
  ];

  // The quantity tolerance as persisted; absent when the policy leaves it
  // to the consumer's default.
  optional double quantity_tolerance = 4 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 1
  ];

  // The reporting window as persisted; absent when the policy leaves it to
  // the consumer's default.
  optional int32 window_seconds = 5 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 31536000
  ];
}
