// RAMP Admin v1 — operator-plane configuration and forensics service.
//
// AdminService carries Exchange operator overrides — the tenant fee rate and
// the tenant reporting policy — plus one forensic read: the append-once
// evidence row the Exchange persists for every executed transaction. It is
// deliberately a separate package and service from ramp.v1.ExchangeService —
// the operator plane is not part of the agent hot-path contract, and keeping
// it out of ramp.v1 keeps the agent-facing surface unchanged.
//
// Trust model: deployments MUST NOT expose AdminService on the public
// agent-facing listener. Reachability is restricted at the network layer
// (an internal listener plus a source allowlist); there is no per-operator
// identity inside the service in v1. Because the admin plane carries no
// RFC 9421 request signing, there is no verified signer to deduplicate
// against — and no RPC here needs one: the setters are full-replace
// overwrites and the evidence read is side-effect-free, so every RPC is
// naturally idempotent and carries no idempotency_key.
//
// The evidence read is keyed by the (tenant_id, transaction_id) PAIR. The
// tenant selector exists because transaction ids leave the deployment:
// every counterparty agent legitimately holds the ids of its own
// transactions, so an id alone must not act as a bearer capability for the
// forensic row, and a request that names the tenant is what lets a
// deployment enforce a per-tenant ACL in front of this RPC. A tenant
// mismatch is NOT_FOUND, byte-identical to an unknown id, so existence
// under another tenant is not revealed. The id format itself is
// implementation-defined (ramp.v1 places no entropy requirement on
// transaction ids); what bounds this read is the pair selector plus the
// network-layer reachability restriction above.
//
// Message shape: each setter takes a thin {ver, <payload>} envelope wrapping a
// required payload message — TenantFeeRate or ReportingPolicy. The payload
// type is shared by the request and its response, so every field rule is
// stated ONCE; the read-back response cannot drift from the write. Responses
// echo the payload as persisted, giving operator tooling a read-back
// confirmation of the applied values. The evidence read does not share this
// shape — its request carries only the (tenant_id, transaction_id) selector,
// and its response wraps read-only payloads that exist on no write path
// (TransactionEvidence, TransactionState, ReportingObligationState).
//
// Validation: every constraint here is a FIELD-level protovalidate rule so it
// flows into the generated Pydantic/Zod types. Cross-field (message-level CEL)
// rules are intentionally absent from this package.
//
// The `ver` envelope field carries the same value and the same send-side rule
// as the agent-facing plane: senders stamp it from one constant, receivers
// treat it as advisory. The agent plane's REASON does not carry over — this
// plane has no RFC 9421 request signing and no Offer, so nothing here rests on
// a signature. What bounds this plane is the network-layer reachability
// restriction stated above; `ver` is a control on neither plane. See "Protocol
// version" in ramp.proto for the value and the single-constant rule.

syntax = "proto3";

package ramp.admin.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/RAMP-Protocol/protocol/gen/go/ramp/admin/v1;rampadminv1";

// Operator-plane configuration and forensic-read RPCs. See the file banner
// for the trust model and why no RPC here carries an idempotency_key.
service AdminService {
  // Sets the tenant's fee rate (basis points) and optional operator note.
  // Full replace: the previous rate and note are overwritten.
  rpc SetTenantFeeRate(SetTenantFeeRateRequest) returns (SetTenantFeeRateResponse);
  // Replaces the tenant's reporting policy (required report fields, quantity
  // tolerance, reporting window). Full replace: omitted optional fields clear
  // their value so the receiving Exchange's defaults apply.
  rpc SetReportingPolicy(SetReportingPolicyRequest) returns (SetReportingPolicyResponse);
  // Returns the append-once evidence row for one executed transaction — the
  // full signed offer, both Ed25519 proofs and the verbatim bytes each was
  // computed over — plus the transaction-log and reporting-obligation state
  // needed to render it. Read-only: it exposes what the execute path already
  // persisted and writes nothing. Selection is by (tenant_id, transaction_id)
  // pair: an unknown transaction_id AND a transaction that exists under a
  // different tenant are both NOT_FOUND, indistinguishably — a transaction id
  // alone must not act as a bearer capability for another tenant's forensic
  // row, and the pair selector is what lets a deployment put a per-tenant ACL
  // in front of this RPC.
  rpc GetTransactionEvidence(GetTransactionEvidenceRequest) returns (GetTransactionEvidenceResponse);
}

// TenantFeeRate is the fee-rate payload shared by SetTenantFeeRate's request
// and response. The field rules live here once, so the write and the echoed
// read-back stay in lockstep.
message TenantFeeRate {
  // The tenant whose fee rate is being set.
  string tenant_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // Fee rate in basis points of gross: fee = floor(gross * bps / 10000).
  // Below 10000 keeps the fee strictly under 100%; integer basis points avoid
  // float drift when aggregating many charges. 0 is a legitimate explicit
  // value ("no fee"), not an unset sentinel.
  int32 fee_rate_bps = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lt = 10000
  ];

  // Operator commentary on the rate (why it was set, by whom, ticket link).
  // Omitted clears any existing note.
  optional string notes = 3 [(buf.validate.field).string.max_len = 1024];
}

// ReportingPolicy is the reporting-policy payload shared by
// SetReportingPolicy's request and response. The field rules live here once, so
// the write and the echoed read-back stay in lockstep.
message ReportingPolicy {
  // The tenant whose reporting policy is being replaced. Same rule as
  // ramp.admin.v1.TenantFeeRate.tenant_id (drift-gated).
  string tenant_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // Report field names the usage-report validator requires. The wire constrains
  // only the token shape; which names are meaningful is defined by the receiving
  // Exchange and may change without a contract change. Names are a set: repeats
  // are rejected. Empty means no required fields.
  repeated string required_fields = 2 [
    (buf.validate.field).repeated.max_items = 32,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1,
    (buf.validate.field).repeated.items.string.max_len = 64,
    (buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9._:*-]+$"
  ];

  // Accepted relative deviation between estimated and reported quantity, as a
  // fraction: 0 requires an exact match, 1 accepts any deviation. Omitted: the
  // receiving Exchange's default tolerance applies.
  optional double quantity_tolerance = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 1
  ];

  // Reporting window in seconds. Applies to obligations minted after this call;
  // obligations already issued keep the window they were minted with. Capped at
  // one year. Omitted: the receiving Exchange's default applies.
  optional int32 window_seconds = 4 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 31536000
  ];
}

message SetTenantFeeRateRequest {
  // RAMP protocol version — "1.0". Stamped by the sender from a single
  // constant; advisory on receive. See "Protocol version" in ramp.proto.
  string ver = 1;

  // The fee rate to apply. Required — an absent payload would otherwise skip
  // validation of its fields.
  TenantFeeRate rate = 2 [(buf.validate.field).required = true];
}

message SetTenantFeeRateResponse {
  // RAMP protocol version — "1.0". Stamped by the sender from a single
  // constant; advisory on receive. See "Protocol version" in ramp.proto.
  string ver = 1;

  // The fee rate as persisted.
  TenantFeeRate rate = 2 [(buf.validate.field).required = true];
}

message SetReportingPolicyRequest {
  // RAMP protocol version — "1.0". Stamped by the sender from a single
  // constant; advisory on receive. See "Protocol version" in ramp.proto.
  string ver = 1;

  // The reporting policy to apply. Required — an absent payload would otherwise
  // skip validation of its fields.
  ReportingPolicy policy = 2 [(buf.validate.field).required = true];
}

message SetReportingPolicyResponse {
  // RAMP protocol version — "1.0". Stamped by the sender from a single
  // constant; advisory on receive. See "Protocol version" in ramp.proto.
  string ver = 1;

  // The reporting policy as persisted.
  ReportingPolicy policy = 2 [(buf.validate.field).required = true];
}

// ObligationState — lifecycle of a reporting obligation, exactly the
// vocabulary the Exchange persists (the storage model's ObligationPending/
// Fulfilled/Expired/Waived/Blocked, see components/exchange/storage-model).
// Defined here rather than imported from ramp.v1 (which carries no such
// enum — the agent plane states reporting REQUIREMENTS, never their
// server-side lifecycle) so the admin package stays self-contained.
//
// A REJECTED usage report (a non-OK UsageReportResponse carrying
// ErrorDetail.usage_report_rejection) does not transition the obligation:
// it stays PENDING until an accepted report, a waiver, or expiry.
enum ObligationState {
  OBLIGATION_STATE_UNSPECIFIED = 0; // never sent — the server always maps a persisted state; rejected (not_in:[0]) on ReportingObligationState.state
  OBLIGATION_STATE_PENDING = 1; // minted; awaiting an accepted usage report
  OBLIGATION_STATE_FULFILLED = 2; // a usage report was received and accepted (including a late report accepted out of BLOCKED)
  OBLIGATION_STATE_EXPIRED = 3; // the reporting window elapsed with no accepted report
  OBLIGATION_STATE_WAIVED = 4; // the Exchange waived the requirement
  OBLIGATION_STATE_BLOCKED = 5; // enforcement gate: an expired obligation met a new transaction attempt; new transactions are rejected until the Exchange lifts the block or accepts a late report
}

// TransactionEvidence — one append-once evidence row, exactly as the Exchange
// persisted it for a successfully executed transaction. The row is written
// only after both signatures verified, and a denied execute writes nothing,
// so the row's existence is itself the success statement.
//
// The row re-verifies OFFLINE, from this message alone — no agent registry,
// no Exchange key file, no live service:
//   * the Exchange signed this exact offer:
//       ed25519.Verify(exchange_signing_public_key, offer_canonical_bytes, hex-decoded offer_sig)
//   * the agent accepted this exact offer:
//       ed25519.Verify(agent_public_key, agent_acceptance_canonical_bytes, hex-decoded agent_acceptance_signature)
// Both verifying public keys ride along (not key ids) so re-verification
// survives key rotation, which removes retired ids from the published JWKS.
// The *_canonical_bytes are the verbatim RFC 8785 JCS bytes each signature
// was computed over, stored as-signed and never re-derived: protobuf-binary
// is non-canonical by protocol rule, and a stored-inputs-only row would stop
// re-verifying the day the canonicalization recipe moved.
//
// TRUST BOUNDARY. Offline re-verification proves the row is INTERNALLY
// CONSISTENT: each signature verifies against the key and bytes stored in
// the same row, so anyone able to write a row could mint one that passes.
// To prove AUTHENTICITY — that these parties actually operated these keys —
// a verifier must compare the embedded keys against copies obtained
// independently: the Exchange's published JWKS (the authority per
// protocol/authentication) and the agent's directory (agent_directory_url
// names where this Exchange pinned agent_public_key from). The in-row keys
// are convenience copies that keep old rows verifiable after rotation; they
// are not the root of trust. After matching a key against its authority, a
// verifier should also check the key's RFC 7638 thumbprint against the
// Exchange's published revocation list (ramp.v1.KeyRevocationList, served at
// WBAFile.revocation_url): a key can be rotated out because it was revoked,
// and a revoked key must not count as authentic.
//
// SCOPE OF THE GUARANTEE. The signatures cover what was AGREED, not what was
// DELIVERED. transaction_id, request_id and created_at are this Exchange's
// own assertions about the delivery, outside both signatures; the delivery
// witness is the edge delivery log, reconciled separately (the join key,
// sha256 of the signed retrieval URL, lives on TransactionState
// .signed_url_hash).
message TransactionEvidence {
  // The evidenced transaction (Exchange-minted transaction identity). The
  // format is implementation-defined, exactly as in ramp.v1 (the documented
  // storage model mints a 26-char ULID). The 255 bound is NEW to this plane —
  // ramp.v1 leaves transaction ids unconstrained — and is safe here because
  // the Exchange mints the id itself, far below that bound; it exists so the
  // selector stays storable and indexable.
  string transaction_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // The tenant the transaction executed under. The admin plane is
  // deployment-scoped (cross-tenant), so the row states its tenant. Same rule
  // as ramp.admin.v1.TenantFeeRate.tenant_id (drift-gated).
  string tenant_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // Exchange side: the signed offer.

  // The signed Offer.offer_id (which IS the catalog resource_id). Duplicated
  // from the offer JSON so the row reads standalone, without parsing it.
  string offer_id = 3 [(buf.validate.field).string.min_len = 1];

  // The signed offer as a raw JSON string, for query and human audit.
  // Deliberately NOT a Struct: a Struct re-normalizes, and the canonical
  // bytes below remain the arbiter of what was signed. No upper bound, unlike
  // this file's 255-capped ids: upstream ramp.v1 places no size bound on an
  // offer, and the row must state whatever the parties actually signed — a
  // cap here could make the row fail its own validation for a transaction
  // that legitimately executed (the requester_id rationale).
  string offer_json = 4 [(buf.validate.field).string.min_len = 1];

  // Verbatim JCS bytes the Exchange's signature was computed over (the offer
  // with its signature fields cleared). min_len only, no ceiling: same
  // rationale as offer_json — the bytes under the signature are whatever size
  // the signed offer was, and a bound could invalidate a legitimate row.
  bytes offer_canonical_bytes = 5 [(buf.validate.field).bytes.min_len = 1];

  // The Exchange's Ed25519 signature over offer_canonical_bytes, hex-encoded
  // in the verbatim wire form (either case — hex decoding accepts both, and a
  // dispute should read the same characters a request log holds). Named after
  // ramp.v1.AgentAcceptancePayload.offer_sig: it is the same value, the one
  // the agent's acceptance binds to.
  string offer_sig = 6 [(buf.validate.field).string.pattern = "^[0-9A-Fa-f]{128}$"];

  // Signing-algorithm label, server-derived from the Exchange's own verify
  // path — never echoed from the wire. The canonical payload clears the wire
  // labels before signing, so an echoed label would sit outside signature
  // coverage and could claim anything under an otherwise valid signature.
  // Pinned to "EdDSA" — the content-signature label
  // ramp.v1.Offer.signature_algorithm pins; "ed25519" is the separate label
  // reserved for RFC 9421 HTTP request signatures and never appears here.
  // const (not min_len) so a generated client also rejects a claimed "none"
  // or "HS256".
  //
  // Spelled sig_algorithm, not signature_algorithm, which is how ramp.v1 and
  // the sibling agent_acceptance_signature_algorithm spell it. The short form
  // is INHERITED, not chosen: this label names the neighbouring offer_sig, and
  // that field copies an upstream field name verbatim
  // (ramp.v1.AgentAcceptancePayload.offer_sig). A label that renamed the field
  // it describes would be the worse inconsistency.
  //
  // The long spelling is also not available: ramp.v1 retired a scalar
  // offer-signature field in RAMP-103 (the execute request now reflects the
  // full signed Offer instead), and scripts/check-doc-conformance.sh bans that
  // identifier across the protos and the docs so the removed name cannot be
  // read as live anywhere. A field named after it here would either fail that
  // gate or force it open.
  string offer_sig_algorithm = 7 [(buf.validate.field).string.const = "EdDSA"];

  // The Exchange verifying key itself (raw 32-byte Ed25519), not a key id.
  bytes exchange_signing_public_key = 8 [(buf.validate.field).bytes.len = 32];

  // Agent side: the acceptance.

  // The agent's Ed25519 signature over agent_acceptance_canonical_bytes,
  // hex-encoded verbatim as it arrived on the wire (either case). Same rule
  // as ramp.admin.v1.TransactionEvidence.offer_sig (drift-gated). The
  // directive anchors INSIDE this package by decision: ramp.v1 deliberately
  // carries no signature-format rule (adding one now would be a wire-visible
  // tightening of the agent plane), and the Exchange hex-decodes and
  // verifies this signature before executing, so no executed transaction can
  // put a malformed signature in its row — the read plane can pin the format
  // without an upstream source to point at.
  string agent_acceptance_signature = 9 [(buf.validate.field).string.pattern = "^[0-9A-Fa-f]{128}$"];

  // Verbatim JCS bytes of the AgentAcceptancePayload the agent signed.
  // Unbounded for the same reason as offer_canonical_bytes. Same rule as
  // ramp.admin.v1.TransactionEvidence.offer_canonical_bytes (drift-gated).
  bytes agent_acceptance_canonical_bytes = 10 [(buf.validate.field).bytes.min_len = 1];

  // Signing-algorithm label, server-derived (see offer_sig_algorithm).
  // Pinned to "EdDSA". Same rule as
  // ramp.admin.v1.TransactionEvidence.offer_sig_algorithm (drift-gated).
  string agent_acceptance_signature_algorithm = 11 [(buf.validate.field).string.const = "EdDSA"];

  // The acceptance payload's remaining inputs (offer_sig above is the
  // fourth), stored so the signed bytes can be independently rebuilt and
  // audited rather than merely trusted.
  //
  // requester_id is the signed Requester.id VERBATIM — the bytes under the
  // agent's signature, never rewritten. It NAMES the same agent as the
  // Exchange's canonical agent identity but is not byte-equal to it: a signer
  // may spell its directory any way it likes (the deployed identity service
  // signs "scheme://host"), so the forensic join goes through directory-host
  // normalization, not plain equality. No wire rule: the agent plane does not
  // constrain Requester.id, and this row states what was signed.
  string requester_id = 12;

  // The signed Requester.domain, verbatim. Unbounded for the same reason as
  // requester_id: upstream ramp.v1.Requester places no wire constraint on
  // either value, and the evidence row must be able to state whatever bytes
  // the acceptance actually signed — a bound here could make the row fail its
  // own validation for a transaction that legitimately executed.
  string requester_domain = 13;

  // The REQUEST-level idempotency key the acceptance signs — NOT the derived
  // per-item key that TransactionState.idempotency_key carries. Same rule as
  // ramp.v1.TransactionRequest.idempotency_key (drift-gated).
  string request_idempotency_key = 14 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // The registry-pinned agent verifying key (raw 32-byte Ed25519) the
  // acceptance verified against. Same rule as
  // ramp.admin.v1.TransactionEvidence.exchange_signing_public_key
  // (drift-gated).
  bytes agent_public_key = 15 [(buf.validate.field).bytes.len = 32];

  // The anchored well-known directory agent_public_key was pinned from. The
  // registry overwrites keys in place on rotation and keeps no history, so
  // this — plus created_at — attests where and when this Exchange obtained
  // the key. Empty when the agent carries no directory anchor: an append-once
  // row states a value for every column, so '' is a stated fact, not a gap.
  //
  // Named directory, not discovery: ramp.v1 uses "discovery" for RESOURCE
  // discovery (DiscoveryRequest, OfferGroup.discovery_method), a different
  // thing entirely. This is the agent's well-known directory document, which
  // is what every sentence describing the field already calls it.
  string agent_directory_url = 16;

  // Delivery + correlation. Covered by neither signature.
  //
  // Deliberately NO signed retrieval URL here: the full URL is a live bearer
  // capability until expiry, and this plane has no request signing and no
  // per-operator identity — serving it back would turn any read into a
  // content-access oracle. The delivery join is hash-only, via
  // TransactionState.signed_url_hash. Stated consequence: a ledger rendered
  // from this contract can NEVER show a signed-URL *signature* match
  // assertion — the delivery assertion this plane supports is hash equality,
  // TransactionState.signed_url_hash against the edge delivery log's
  // url_hash column.

  // Correlation id joining this row outward (edge delivery log,
  // reconciliation sweep), with its provenance. One message, not two
  // sibling fields: presence of the message is the pairing — id and
  // provenance flag arrive together or not at all, a constraint two
  // optional siblings could not express without message-level CEL (which
  // this file forbids). Absent when the Exchange recorded no correlation id.
  RequestCorrelation request_correlation = 17;

  // When the Exchange wrote this row (server clock).
  google.protobuf.Timestamp created_at = 18 [(buf.validate.field).required = true];
}

// RequestCorrelation — the recorded X-Request-ID correlation for one
// evidence row, with its provenance. See TransactionEvidence
// .request_correlation for why this is a message rather than two sibling
// fields.
message RequestCorrelation {
  // The correlation id as persisted. Caller-influenceable: the SDK's
  // request-id middleware propagates any non-empty caller-supplied
  // X-Request-ID verbatim (no conformance check) and mints a random 128-bit
  // hex token when the header is absent. The rules below therefore bound
  // what this PLANE will replay into a rendered ledger — printable ASCII,
  // capped — and the Exchange records a correlation only when the persisted
  // id conforms; a nonconforming header value is recorded as no correlation
  // (the wrapping message stays absent), never echoed here.
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    pattern: "^[!-~]+$"
  }];

  // Provenance: true = server-minted, false = propagated from the caller.
  // The two are byte-indistinguishable in request_id alone, so a forensic
  // read needs this flag to tell a server-derived correlation key from an
  // attacker-influenceable one.
  bool minted = 2;
}

// TransactionState — the thin transaction-log facts a ledger renderer needs
// next to the evidence row. The log row is the operational record (updated
// when a usage report lands); the evidence row is the append-once proof.
// There is deliberately no status field: a denied execute aborts before any
// row is written, so evidence only ever describes a successful execute —
// existence is the status, and a renderer derives its status cell from it.
message TransactionState {
  // The transaction's per-item idempotency key as logged. The Exchange
  // derives it as TransactionEvidence.request_idempotency_key + ":" +
  // offer_id — unconditionally, single-item requests included — so distinct
  // items of a batch dedupe independently, and this value is NEVER byte-equal
  // to the request-level key. A ledger joining this row against a log export
  // matches on this derived form, not on the bare request key. No upper
  // bound: the derivation appends an id whose length nothing constrains.
  string idempotency_key = 1 [(buf.validate.field).string.min_len = 1];

  // When the signed retrieval URL expires.
  google.protobuf.Timestamp expiry = 2 [(buf.validate.field).required = true];

  // sha256 of the signed retrieval URL — the join key against the edge
  // delivery log's url_hash. Hash-only by design: the full URL is a live
  // bearer capability until expiry and is deliberately absent from this
  // plane (see TransactionEvidence's delivery section).
  bytes signed_url_hash = 3 [(buf.validate.field).bytes.len = 32];

  // The broker that routed the acceptance, as the transaction log recorded
  // it. '' when the acceptance arrived direct — the log's broker column is
  // optional-empty, and an append-once view states a value for every
  // column, so '' is a stated fact, not a gap. A ledger renders its
  // "broker routed" row from this. No wire rule: this states whatever the
  // log holds, and nothing upstream constrains the broker label.
  string broker = 4;
}

// ReportingObligationState — the server-side lifecycle record of the
// transaction's reporting obligation, as persisted. Named apart from
// ramp.v1.ReportingObligation, which is the agent-facing requirements
// contract; this is the state those requirements minted.
//
// The timestamp fields carry the store's own column names (WindowEnd,
// FulfilledAt, CreatedAt) in snake_case, so a reader can join this record
// against the storage model by name and see there is no translation step in
// between. consumed_quantity is the one field with no column behind it: it
// comes from the accepted usage report, not from the obligation row.
message ReportingObligationState {
  // Lifecycle state. Always a real persisted state, never UNSPECIFIED.
  // Server-output enum: {defined_only, not_in: [0]} — a reader must never
  // see a number its schema cannot name. Same rule as
  // ramp.v1.TransactionDenial.reason (drift-gated) — the discipline the
  // ErrorDetail reason discriminators establish for server-output enums.
  ObligationState state = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  // Reported consumed quantity, in the metering unit from the Offer's
  // Pricing — the value the accepted usage report carried. Mirrors
  // ramp.v1.Usage.consumed_quantity's wire type (int32, unconstrained)
  // exactly: this view must be able to state whatever the report stated,
  // and a decimal-string shape here could express values (e.g. "3.5") no
  // report can produce. Absent until a usage report has been accepted.
  optional int32 consumed_quantity = 2;

  // When the usage report is due (the store's WindowEnd). An absolute
  // instant, not the ramp.v1.ReportingObligation.window Duration it was
  // derived from: this record states what the store holds, and the store
  // resolved the window against created_at when it minted the obligation.
  google.protobuf.Timestamp window_end = 3 [(buf.validate.field).required = true];

  // When a usage report was ACCEPTED (the store's FulfilledAt) — the same
  // event that moves state to OBLIGATION_STATE_FULFILLED. Not "when a report
  // arrived": a report that arrived and was rejected leaves this absent, and
  // the obligation still expires on window_end.
  optional google.protobuf.Timestamp fulfilled_at = 4;

  // When the obligation was minted (the store's CreatedAt).
  google.protobuf.Timestamp created_at = 5 [(buf.validate.field).required = true];
}

message GetTransactionEvidenceRequest {
  // RAMP protocol version — "1.0". Stamped by the sender from a single
  // constant; advisory on receive. See "Protocol version" in ramp.proto.
  string ver = 1;

  // The transaction whose evidence row to fetch. Same rule as
  // ramp.admin.v1.TransactionEvidence.transaction_id (drift-gated) — the row
  // identity this request selects by.
  string transaction_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];

  // The tenant the transaction must belong to — the second half of the
  // selector, matched against TransactionEvidence.tenant_id. Required:
  // counterparty agents legitimately hold transaction ids, so the id alone
  // must not be enough to read the row, and naming the tenant here is what
  // makes a per-tenant ACL possible on this plane. A mismatch is NOT_FOUND,
  // byte-identical to an unknown transaction_id, so existence under another
  // tenant is not revealed. Same rule as
  // ramp.admin.v1.TenantFeeRate.tenant_id (drift-gated).
  string tenant_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
}

message GetTransactionEvidenceResponse {
  // RAMP protocol version — "1.0". Stamped by the sender from a single
  // constant; advisory on receive. See "Protocol version" in ramp.proto.
  string ver = 1;

  // The append-once evidence row. Required: it exists 1:1 for every found
  // transaction — an unknown transaction_id is NOT_FOUND, never an empty
  // response.
  TransactionEvidence evidence = 2 [(buf.validate.field).required = true];

  // The transaction-log facts next to it. Required for the same 1:1 reason.
  TransactionState transaction_state = 3 [(buf.validate.field).required = true];

  // The transaction's reporting obligation record, as persisted. The store
  // keeps ONE obligation per transaction (keyed on the transaction id,
  // transitioning in place — see the storage model), so this is the record
  // the Exchange's own reporting path acts on, not a "latest of several".
  // Absent when the transaction minted none.
  ReportingObligationState obligation_state = 4;
}
