version: v2
managed:
  enabled: true
plugins:
  # Remote plugin versions are PINNED. gen/ (incl. gen/descriptor.binpb) is a
  # byte-exact, drift-gated artifact; an unpinned plugin lets an upstream bump
  # change the output with no schema change, false-positiving the drift gate
  # (the M-7 class — commit b1baa4f was exactly a protoc-gen-es 2.12.0→2.12.1
  # no-op regen). Bump deliberately, then regenerate and commit gen/ in the
  # same change. Keep versions in step with go.mod's runtime deps.
  # Go code generation
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ../gen/go
    opt: paths=source_relative
  # Connect-Go (HTTP/JSON + gRPC)
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../gen/go
    opt: paths=source_relative
  # NOTE: the protobuf-native TS (protobuf-es) and Python (_pb2/connect) SDKs were
  # removed — they are not usable in the target ecosystems (FastMCP needs Pydantic,
  # edge stacks need Zod), and consumers were hand-mirroring the proto anyway. The
  # TS/Python *types export* is now generated as Pydantic + Zod from JSON Schema
  # (see scripts/gen-sdk-types.sh). Go keeps native protobuf (it's the server).
  # RAMP vocabulary constants — reads (ramp.v1.vocab) field options and
  # (ramp.v1.vocab_enum) enum-value options and emits typed token constants +
  # membership check per axis (Pricing.unit, Quota.metric, function, geography,
  # user-type) for EVERY SDK language in one pass: Go, TypeScript, and Python.
  # out is ../gen (not ../gen/go/vocab) so it writes go/vocab/, ts/vocab/, and
  # python/vocab/ from the single source — the three cannot drift from each other.
  - local: ["go", "run", "github.com/RAMP-Protocol/protocol/cmd/protoc-gen-rampvocab"]
    out: ../gen
