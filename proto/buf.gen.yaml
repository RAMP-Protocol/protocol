version: v2
managed:
  enabled: true
plugins:
  # Go code generation
  - remote: buf.build/protocolbuffers/go
    out: ../gen/go
    opt: paths=source_relative
  # Connect-Go (HTTP/JSON + gRPC)
  - remote: buf.build/connectrpc/go
    out: ../gen/go
    opt: paths=source_relative
  # TypeScript message types (protobuf-es)
  - remote: buf.build/bufbuild/es
    out: ../gen/ts
    opt: target=ts
  # TypeScript Connect service client/handler
  - remote: buf.build/connectrpc/es
    out: ../gen/ts
    opt: target=ts
  # RAMP vocabulary constants — reads (ramp.v1.vocab) field options and
  # (ramp.v1.vocab_enum) enum-value options and emits typed token constants +
  # IsRegistered per axis (Pricing.unit, Quota.metric, function, geography,
  # user-type).
  - local: ["go", "run", "github.com/RAMP-Protocol/protocol/cmd/protoc-gen-rampvocab"]
    out: ../gen/go/vocab
