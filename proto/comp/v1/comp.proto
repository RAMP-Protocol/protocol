// CoMP V1 — IAB Tech Lab Content Monetization Protocols (finalized 2026-04-28).
//
// 1:1 mapping from the canonical CoMP V1 specification.
// Source (immutable pin): https://github.com/IABTechLab/CoMP/blob/880238e0100b3d0d67d5afd7357a18fc21a97be5/CoMP-1.0.md
// Spec-file content blob SHA (content-addressed): aa8c796be7a9bcfa1189a1cf6c1ec50aa67a0f5f
// NOTE: the 1.0-202604 release tag does NOT contain the spec; main carries it.
//
// Enum alignment: proto3 enum values map directly to CoMP integer values
// (first real CoMP value = 0). No UNSPECIFIED sentinels — proto3 default
// zero is a valid CoMP value, not a sentinel.
//
// This file preserves CoMP field names, enum values, and semantics exactly.
// Canonical V1 has no separate License object: all commercial/licensing terms
// live on Scope (ause, pricetype, pricetier, unitprice, cur, country,
// licensedur). RAMP extensions live in ramp/v1/ramp.proto, never here.

syntax = "proto3";

package comp.v1;

option go_package = "github.com/RAMP-Protocol/protocol/gen/go/comp/v1;compv1";

import "google/protobuf/struct.proto";

// AISystem — Information about the AI System making the request.
// CoMP §aisystem.json
message AISystem {
  // Canonical domain of the AI System requesting access.
  string name = 1;

  // User agent of the AI System.
  optional string ua = 2;

  // ID of the AI system, as registered by Tech Lab Agent Registry.
  optional string id = 3;

  // How the AI system will use the content.
  AISystemUse aisysuse = 4;

  // Implementer-specific extensions.
  google.protobuf.Struct ext = 15;
}

// AISystemUse — Intended use of the requested content.
// CoMP §aisystemuse.json
message AISystemUse {
  // License ID — public agent identifier in CoMP. NOT a credential.
  // In RAMP this maps to Requester.billing_ref (a billing handle, not an
  // entitlement). Request authentication is an RFC 9421 HTTP Message Signature;
  // the agent's key is resolved by its domain, never by this id.
  string lid = 1;

  // How the AI system authenticates itself.
  AuthMethod aiauth = 2;

  // URI(s) that the AI System is requesting to crawl.
  repeated string uri = 3;

  // General information about the content scope requested.
  optional ScopeType scope = 4;

  // Function(s) the AI System will use the content for.
  repeated Function function = 5;

  // Sub-function(s) for content use.
  repeated SubFunction subfn = 6;

  // Whether results will be displayed to a human user. 0=no, 1=yes.
  optional int32 resdis = 7;

  google.protobuf.Struct ext = 15;
}

// AuthMethod — How the AI system authenticates.
// CoMP §aisystemuse.aiauth
enum AuthMethod {
  AUTH_METHOD_USER_AGENT = 0;   // CoMP 0
  AUTH_METHOD_IP = 1;           // CoMP 1
  AUTH_METHOD_TOKEN = 2;        // CoMP 2
  AUTH_METHOD_WEBBOT = 3;       // CoMP 3
  AUTH_METHOD_AGENT_ID = 4;     // CoMP 4 (Tech Lab Registry)
  AUTH_METHOD_OTHER = 5;        // CoMP 5
}

// ScopeType — Content scope categories.
// CoMP §aisystemuse.scope and §scope.scope
enum ScopeType {
  SCOPE_TYPE_FULL_CORPUS = 0;   // CoMP 0
  SCOPE_TYPE_SECTION = 1;       // CoMP 1
  SCOPE_TYPE_DATE_RANGE = 2;    // CoMP 2
  SCOPE_TYPE_GENRE = 3;         // CoMP 3
  SCOPE_TYPE_TOPIC = 4;         // CoMP 4
  SCOPE_TYPE_CURATED = 5;       // CoMP 5
  SCOPE_TYPE_OTHER = 6;         // CoMP 6
}

// Function — What the AI system will use the content for.
// CoMP §aisystemuse.function — Function Definitions:
//   0 all       — All functions (no restriction on use).
//   1 ai-all     — All AI functions (training, input, indexing).
//   2 ai-train   — Use as AI/ML training data.
//   3 ai-input   — Use as runtime input/grounding (e.g. RAG, agent view).
//   4 ai-index   — Use to build a search/retrieval index.
//   5 search     — Use for traditional search indexing.
enum Function {
  FUNCTION_ALL = 0;             // CoMP 0
  FUNCTION_AI_ALL = 1;          // CoMP 1
  FUNCTION_AI_TRAIN = 2;        // CoMP 2
  FUNCTION_AI_INPUT = 3;        // CoMP 3
  FUNCTION_AI_INDEX = 4;        // CoMP 4
  FUNCTION_SEARCH = 5;          // CoMP 5
}

// SubFunction — Specific sub-function for content use.
// CoMP §aisystemuse.subfn — SubFunction Definitions:
//   0 training       — Model training.
//   1 rag            — Retrieval-augmented generation.
//   2 grounding      — Grounding/citation at inference time.
//   3 agent-view     — Agent reads content on a user's behalf.
//   4 agent-actions  — Agent acts on content on a user's behalf.
//   5 other          — Any other sub-function.
enum SubFunction {
  SUB_FUNCTION_TRAINING = 0;      // CoMP 0
  SUB_FUNCTION_RAG = 1;           // CoMP 1
  SUB_FUNCTION_GROUNDING = 2;     // CoMP 2
  SUB_FUNCTION_AGENT_VIEW = 3;    // CoMP 3
  SUB_FUNCTION_AGENT_ACTIONS = 4; // CoMP 4
  SUB_FUNCTION_OTHER = 5;         // CoMP 5
}

// Package — A package of content inventory.
// CoMP §package.json
message Package {
  // Unique package identifier defined by the Content Owner or Marketplace.
  string id = 1;

  // Title of the package.
  optional string title = 2;

  // Canonical domain of the business entity offering the content.
  optional string seller = 3;

  // Canonical domain of the packager, if different than the seller.
  optional string packager = 4;

  // URL for AI system to find the License(s) required to access content.
  // SSRF/fetch sink: a consumer that dereferences this URL must apply the
  // countermeasures specified for core License.uri (threat model T-LIC-1).
  optional string licenseurl = 5;

  // Whether citation of the Content Owner is required. 0=no, 1=yes.
  optional int32 citation = 6;

  // URL for AI system to send usage reporting to the Content Owner or
  // Marketplace. POST/exfil sink: apply the SSRF countermeasures specified
  // for core License.uri (threat model T-LIC-1) before dereferencing.
  optional string reporturl = 7;

  // Scope of content in this package.
  optional Scope scope = 8;

  // How to retrieve the content.
  optional Retrieval retrieval = 9;

  google.protobuf.Struct ext = 15;
}

// Scope — What content is included in the package, plus its commercial terms.
// CoMP §scope.json — canonical V1 folds licensing/pricing into Scope.
message Scope {
  // How much of the Content Owner's corpus is available in this package.
  optional ScopeType scope = 1;

  // Kind of use that is allowed for this package.
  optional AllowedUse ause = 2;

  // How the package is priced.
  optional PriceType pricetype = 3;

  // Tier identifier if pricing is tiered (pricetype = 4).
  optional int32 pricetier = 4;

  // Content Owner set unit price at the given basis. Typed `double` to mirror
  // the CoMP spec; downstream billing must convert to a decimal / minor-units
  // representation — do not settle money directly off this float.
  optional double unitprice = 5;

  // Bid currency using ISO-4217 alpha codes. Default "USD".
  optional string cur = 6;

  // Country code(s) where this package may be used, expressed by
  // ISO-3166-1 numeric codes.
  repeated int32 country = 7;

  // Number of days the license is active, once the content package has been
  // delivered to the AI System.
  optional int32 licensedur = 8;

  // Upper limit on crawl. 0=unlimited, 1=has maximum.
  optional int32 max = 9;

  // Content type(s) included.
  repeated ContentType ctype = 10;

  // Text assets.
  repeated Text text = 11;

  // Video assets.
  repeated Video video = 12;

  // Image assets.
  repeated Image image = 13;

  // Audio assets.
  repeated Audio audio = 14;

  google.protobuf.Struct ext = 15;
}

// AllowedUse — Kind of use allowed for a package.
// CoMP §scope.ause — List: Allowed Use
enum AllowedUse {
  ALLOWED_USE_COMMERCIAL = 0;      // CoMP 0
  ALLOWED_USE_NON_COMMERCIAL = 1;  // CoMP 1
  ALLOWED_USE_EDUCATIONAL = 2;     // CoMP 2
  ALLOWED_USE_GOVERNMENT = 3;      // CoMP 3
  ALLOWED_USE_PERSONAL = 4;        // CoMP 4
  ALLOWED_USE_BYO_LICENSE = 5;     // CoMP 5 (refer to terms in licenseurl)
  ALLOWED_USE_OTHER = 6;           // CoMP 6
}

// PriceType — How a package is priced.
// CoMP §scope.pricetype — List: Price Type
enum PriceType {
  PRICE_TYPE_PER_USE = 0;     // CoMP 0
  PRICE_TYPE_PER_QUERY = 1;   // CoMP 1
  PRICE_TYPE_PER_TOKEN = 2;   // CoMP 2
  PRICE_TYPE_FLAT = 3;        // CoMP 3
  PRICE_TYPE_TIERED = 4;      // CoMP 4 (Tiered Rate)
  PRICE_TYPE_OTHER = 5;       // CoMP 5
}

// ContentType — Type of content in the package.
// CoMP §scope.ctype
enum ContentType {
  CONTENT_TYPE_TEXT = 0;        // CoMP 0
  CONTENT_TYPE_VIDEO = 1;       // CoMP 1
  CONTENT_TYPE_IMAGE = 2;       // CoMP 2
  CONTENT_TYPE_AUDIO = 3;       // CoMP 3
  CONTENT_TYPE_ALL = 4;         // CoMP 4
  CONTENT_TYPE_OTHER = 5;       // CoMP 5
}

// Text — A text-based asset.
// CoMP §text.json
message Text {
  optional string title = 1;

  // Count of whitespace-delimited words in main body.
  repeated int32 wordcount = 2;

  // Original publication date (ISO 8601).
  optional string pubdate = 3;

  // Denotes if the content is publicly available. Default 1 for Text.
  optional int32 published = 4;

  // Most recent substantive update (ISO 8601).
  optional string update = 5;

  // Author name(s).
  repeated string author = 6;

  // Source of creation. 0=human, 1=ai, 2=hybrid.
  optional int32 sourcetype = 7;

  // Provenance available. 0=no, 1=yes.
  optional int32 provenance = 8;

  // Canonical domain of the provenance entity (e.g. c2pa.org).
  // Required if provenance = 1.
  optional string provent = 9;

  // IAB category taxonomy in use. Default 9 (IAB Content Category Taxonomy 3.1).
  optional int32 cattax = 10;

  // IAB Tech Lab content category codes (per cattax).
  repeated int32 cat = 11;

  // Content language. CoMP declares this `int` (array) though its prose says
  // ISO-639-1 (alpha-2) — an upstream inconsistency; the proto follows the
  // declared `int` type.
  repeated int32 language = 12;

  google.protobuf.Struct ext = 15;
}

// Video — A video asset.
// CoMP §video.json
message Video {
  repeated string title = 1;
  repeated int32 dur = 2;           // Duration in seconds.
  optional int32 clip = 3;          // 0=full, 1=clip.
  repeated int32 wordcount = 4;
  optional int32 transcript = 5;    // 0=no, 1=yes.
  optional string pubdate = 6;
  // Denotes if the content is publicly available. Default 0 for Video.
  optional int32 published = 7;
  optional string update = 8;
  repeated string author = 9;
  optional int32 sourcetype = 10;
  optional int32 provenance = 11;
  optional string provent = 12;

  // IAB category taxonomy in use. Default 9 (IAB Content Category Taxonomy 3.1).
  optional int32 cattax = 13;

  // IAB Tech Lab content category codes (per cattax).
  repeated int32 cat = 14;

  // Content language. CoMP declares this `int` (array) though its prose says
  // ISO-639-1 (alpha-2) — an upstream inconsistency; the proto follows the
  // declared `int` type.
  // Tag 16 sits above ext (15) only here: cattax/cat consumed 13/14, and ext is
  // kept at 15 for cross-message uniformity rather than the usual terminal slot.
  repeated int32 language = 16;

  google.protobuf.Struct ext = 15;
}

// Image — An image asset.
// CoMP §image.json
message Image {
  repeated string title = 1;
  optional string pubdate = 2;
  // Denotes if the content is publicly available. Default 0 for Image.
  optional int32 published = 3;
  optional string update = 4;
  repeated string author = 5;
  optional int32 sourcetype = 6;
  optional int32 provenance = 7;
  optional string provent = 8;

  // IAB category taxonomy in use. Default 9 (IAB Content Category Taxonomy 3.1).
  optional int32 cattax = 9;

  // IAB Tech Lab content category codes (per cattax).
  repeated int32 cat = 10;

  // Content language. CoMP declares this `int` (array) though its prose says
  // ISO-639-1 (alpha-2) — an upstream inconsistency; the proto follows the
  // declared `int` type.
  repeated int32 language = 11;

  google.protobuf.Struct ext = 15;
}

// Audio — An audio asset.
// CoMP §audio.json
message Audio {
  repeated string title = 1;
  repeated int32 dur = 2;
  repeated int32 wordcount = 3;
  optional int32 transcript = 4;
  optional string pubdate = 5;
  // Denotes if the content is publicly available. Default 0 for Audio.
  optional int32 published = 6;
  optional string update = 7;
  repeated string author = 8;
  optional int32 sourcetype = 9;
  optional int32 provenance = 10;
  optional string provent = 11;

  // IAB category taxonomy in use. Default 9 (IAB Content Category Taxonomy 3.1).
  optional int32 cattax = 12;

  // IAB Tech Lab content category codes (per cattax).
  repeated int32 cat = 13;

  // Content language. CoMP declares this `int` (array) though its prose says
  // ISO-639-1 (alpha-2) — an upstream inconsistency; the proto follows the
  // declared `int` type.
  repeated int32 language = 14;

  google.protobuf.Struct ext = 15;
}

// Retrieval — How to access content after authorization.
// CoMP §retrieval.json
message Retrieval {
  // Authorization type.
  optional RetrievalAuth auth = 1;

  // Entry point / feed URI. SSRF/fetch sink: apply the countermeasures
  // specified for core License.uri (threat model T-LIC-1) before fetching.
  optional string endpoint = 2;

  // Endpoint type(s).
  repeated RetrievalType type = 3;

  google.protobuf.Struct ext = 15;
}

// RetrievalAuth — Authorization method for content access.
// CoMP §retrieval.auth — List: Authorization Type
enum RetrievalAuth {
  RETRIEVAL_AUTH_NONE = 0;       // CoMP 0
  RETRIEVAL_AUTH_API_KEY = 1;    // CoMP 1 (api_key)
  RETRIEVAL_AUTH_OAUTH2 = 2;     // CoMP 2 (oauth2)
  RETRIEVAL_AUTH_SSL = 3;        // CoMP 3 (SSL)
  RETRIEVAL_AUTH_OTHER = 4;      // CoMP 4 (Other)
}

// RetrievalType — Endpoint type for content retrieval.
// CoMP §retrieval.type
enum RetrievalType {
  RETRIEVAL_TYPE_HTML = 0;       // CoMP 0
  RETRIEVAL_TYPE_RSS = 1;        // CoMP 1
  RETRIEVAL_TYPE_API = 2;        // CoMP 2
  RETRIEVAL_TYPE_MCP = 3;        // CoMP 3
  RETRIEVAL_TYPE_NLWEB = 4;      // CoMP 4
  RETRIEVAL_TYPE_XML = 5;        // CoMP 5
  RETRIEVAL_TYPE_NEWSML = 6;     // CoMP 6
  RETRIEVAL_TYPE_OTHER = 7;      // CoMP 7
}
